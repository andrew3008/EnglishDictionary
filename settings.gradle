pluginManagement {
    def platformConventionsVersion = '1.0.3'
    
    repositories {
        maven {
            url = "https://n.1440.space/repository/platform-maven/"
        }
        maven {
            url = "https://n.1440.space/repository/platform-maven-dev/"
        }
        maven {
            url = "https://n.1440.space/repository/plugins.gradle.org-proxy/"
        }
        maven {
            url = "https://n.1440.space/repository/repo1.maven.org-proxy"
        }
        mavenLocal()
    }

    plugins {
        id 'platform.java-base' version platformConventionsVersion
        id 'platform.java-library' version platformConventionsVersion
        id 'platform.java-library-publish' version platformConventionsVersion
        id 'platform.java-platform-publish' version platformConventionsVersion
        id 'platform.testing' version platformConventionsVersion
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        maven {
            url = uri("https://n.1440.space/repository/platform-maven/")
        }
        maven {
            url = uri("https://n.1440.space/repository/platform-maven-dev/")
        }
        maven {
            url = uri("https://n.1440.space/repository/repo1.maven.org-proxy")
        }
        maven {
            url = uri("https://n.1440.space/repository/plugins.gradle.org-proxy/")
        }
        mavenLocal()
    }
}

