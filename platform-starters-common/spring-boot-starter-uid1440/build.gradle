plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

group = rootProject.group

tasks.named('jar', Jar).configure {
    archiveBaseName = 'spring-boot-starter-uid1440'
}

publishing {
    publications.named('mavenJava', MavenPublication).configure {
        artifactId = 'spring-boot-starter-uid1440'
        pom.description.set(project.description)
    }
}

dependencies {
    api 'com.github.f4b6a3:uuid-creator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.tngtech.archunit:archunit-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
