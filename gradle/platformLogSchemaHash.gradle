import java.nio.charset.StandardCharsets
import java.security.MessageDigest

class PlatformLogSchemaHashes {
    static final String ALGORITHM = 'PLATFORM_LOG_SCHEMA_SET_SHA256_V1'
    static final String NAME = 'platform-log-event-v1'
    static final String SEMANTIC_VERSION = '1'
    static final List<String> FILE_NAMES = [
            'platform-log-event-v1.schema.json'
    ].asImmutable()

    static byte[] normalize(byte[] raw) {
        int offset = 0
        if (raw.length >= 3
                && (raw[0] & 0xFF) == 0xEF
                && (raw[1] & 0xFF) == 0xBB
                && (raw[2] & 0xFF) == 0xBF) {
            offset = 3
        }
        String text = new String(raw, offset, raw.length - offset, StandardCharsets.UTF_8)
        String normalized = text.replace('\r\n', '\n').replace('\r', '\n')
        return normalized.getBytes(StandardCharsets.UTF_8)
    }

    static String sha256Hex(byte[] bytes) {
        byte[] digest = MessageDigest.getInstance('SHA-256').digest(bytes)
        StringBuilder hex = new StringBuilder(digest.length * 2)
        for (byte value : digest) {
            hex.append(String.format('%02x', value & 0xFF))
        }
        return hex.toString()
    }

    static Map hashSet(File schemaDir) {
        return hashSetOf(schemaDir, FILE_NAMES)
    }

    static Map hashSetOf(File schemaDir, List<String> fileNames) {
        List<String> names = new ArrayList<>(fileNames)
        names.sort()
        ByteArrayOutputStream preimage = new ByteArrayOutputStream()
        Map<String, String> fileHashes = [:]
        names.each { String name ->
            File file = new File(schemaDir, name)
            if (!file.isFile()) {
                throw new GradleException("Platform log schema file is missing: ${file}")
            }
            byte[] normalized = normalize(file.bytes)
            fileHashes[name] = sha256Hex(normalized)
            preimage.write(name.getBytes(StandardCharsets.UTF_8))
            preimage.write(0)
            preimage.write(Integer.toString(normalized.length).getBytes(StandardCharsets.UTF_8))
            preimage.write(0)
            preimage.write(normalized)
            preimage.write(0)
        }
        return [
                algorithm      : ALGORITHM,
                name           : NAME,
                semanticVersion: SEMANTIC_VERSION,
                setSha256      : sha256Hex(preimage.toByteArray()),
                fileHashes     : fileHashes.asImmutable()
        ].asImmutable()
    }
}

// Applied-script класс не резолвится как property проекта; Class передаём в task action с конфигурации.
ext.platformLogSchemaHashesType = PlatformLogSchemaHashes
