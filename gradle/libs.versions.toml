# =============================================================================
#  Каталог версий Gradle (`libs.versions.toml`)
# =============================================================================
#
#  Назначение
#  ----------
#  Единый реестр версий и координат библиотек, применяемых во вспомогательных
#  и тестовых конфигурациях сборки платформенных стартеров. Каталог
#  обеспечивает type-safe доступ к зависимостям из `build.gradle` (выражения
#  вида `libs.archunit.junit5`, `libs.bundles.testcontainers`) и устраняет
#  расхождение версий одной и той же библиотеки между модулями.
#
#  Версии внутренних модулей с независимым жизненным циклом
#  --------------------------------------------------------
#  Некоторые артефакты монорепозитория публикуются из этого репозитория, но их
#  семантическая версия намеренно не совпадает с общей `rootProject.version`
#  (лайн релиза платформы). Номера таких версий хранятся в секции `[versions]`
#  под осмысленными ключами (напр. `errorHandlingModel`).
#
#  Этот каталог является единственным источником истины для такой версии и
#  используется одновременно в двух местах внутри монорепозитория:
#    1. В `build.gradle` самого модуля — для установки `version` публикуемого
#       артефакта (напр. `error-handling-model/build.gradle` →
#       `version = libs.versions.errorHandlingModel.get()`).
#    2. В платформенном BOM — для констрейнта координаты
#       `space.br1440.platform:<artifactId>` через `libs.versions.<ключ>.get()`,
#       благодаря которому потребители платформы подключают артефакт
#       без явной версии (она навязывается BOM).
#  За счёт единого источника гарантируется отсутствие расхождения между
#  фактической версией опубликованного артефакта и констрейнтом BOM.
#
#  Сам каталог потребителям платформы не доставляется (`libs.versions.toml`
#  не публикуется), поэтому хранение версий внутренних модулей здесь не
#  обязывает микросервисы указывать их в своих `build.gradle`.
#  См. также регламент в `spring-boot-starter-platform-bom/build.gradle`.
#
#  Разграничение с платформенным BOM
#  ---------------------------------
#  Каталог и BOM (`spring-boot-starter-platform-bom`) решают разные задачи и
#  не должны дублировать друг друга:
#
#   * BOM публикуется потребителям платформы и управляет версиями
#     зависимостей, входящих в API стартеров (используются в `src/main`).
#   * Каталог — внутренний инструмент монорепозитория. Он не публикуется
#     и не влияет на граф версий потребителей; здесь хранятся версии,
#     которые нужны исключительно при сборке/тестировании самих стартеров.
#
#  Исключение: BOM-версии в каталоге
#  ----------------------------------
#  Версии сторонних зависимостей, публикуемых в BOM-constraints, также хранятся
#  здесь — в секции `[versions]` с префиксом `bom-`. Это исключение из общего
#  правила «каталог только для тестовых конфигураций», обоснованное следующим:
#   * единственная альтернатива — ext { Map } в build.gradle, который лишён
#     IDE type-safety, не поддерживается Renovate/Dependabot и является
#     legacy-паттерном Gradle 8+;
#   * `libs.versions.toml` уже используется в BOM для `errorHandlingModel` —
#     прецедент задан самим регламентом;
#   * потребители BOM получают инлайновые версии в опубликованном POM;
#     внутренний источник (TOML vs ext) для них невидим.
#  Ключи BOM-версий намеренно отделены префиксом `bom-`, чтобы отличать их
#  от тестовых/вспомогательных версий при ревью и автоматическом обновлении.
#
#  Соглашение по именованию BOM-ключей:
#  Дефис в `[versions]` создаёт вложенную группу в генерируемых акцессорах
#  (аналогично `[libraries]`). Ключ `bom-logstash` генерирует акцессор
#  `libs.versions.bom.logstash.get()`. Поэтому часть после `bom-` должна быть
#  однословным alias без дефисов, чтобы избежать глубокой вложенности:
#    Правильно:  bom-logstash    → libs.versions.bom.logstash.get()
#    Неправильно: bom-logstash-logback-encoder → libs.versions.bom.logstash.logback.encoder.get()
#
#  Регламент включения зависимости в каталог
#  -----------------------------------------
#  В каталог помещается версия библиотеки только при выполнении всех условий:
#   1. Зависимость используется в тестовых конфигурациях стартеров
#      (`testImplementation`, `testRuntimeOnly`, `testCompileOnly`,
#      `testAnnotationProcessor`) или во вспомогательных конфигурациях
#      сборки, не публикуемых потребителям.
#   2. Зависимость востребована более чем одним модулем монорепозитория
#      либо обоснованно прогнозируется её использование в нескольких
#      модулях. Версии, нужные единственному модулю, размещаются локально
#      в его `build.gradle` (например, в блоке `ext { ... }`) и в каталог
#      не выносятся.
#   3. Версией не управляет Spring Boot BOM (`spring-boot-dependencies`).
#      Если совпадает — приоритет за управлением Spring Boot, дублирование
#      в каталоге создаёт риск дрейфа при обновлении Boot.
#
#  Регламент сопровождения
#  -----------------------
#   * Имя ключа в `[versions]` совпадает с базовым артефактом или
#     согласованным семейством (например, `testcontainers` — общая
#     версия для группы артефактов `org.testcontainers:*`).
#   * Версия библиотеки задаётся один раз в секции `[versions]`, а в секции
#     `[libraries]` указывается только ссылка на этот ключ через `version.ref`.
#     Записывать номер версии прямо в строке библиотеки запрещено: это лишает
#     каталог единого источника правды и приводит к рассинхронизации версий.
#
#     Правильно (версия в `[versions]`, ссылка в `[libraries]`):
#         [versions]
#         testcontainers = "1.21.3"
#
#         [libraries]
#         testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
#
#     Неправильно (версия записана непосредственно в строке библиотеки):
#         [libraries]
#         testcontainers-core = { module = "org.testcontainers:testcontainers", version = "1.21.3" }
#   * При удалениии зависимости соответствующие записи из
#     `[versions]`, `[libraries]` и `[bundles]` удаляются одновременно с
#     удалением её упоминаний из `build.gradle` модулей.
# =============================================================================

[versions]
# ------------------------------------------------------------
# Внутренние модули платформы с независимым жизненным циклом
# ------------------------------------------------------------
errorHandlingModel  = "1.0.0"

# ----------------------------------------------------------------------------------
# BOM-версии: сторонние зависимости, публикуемые в constraints платформенного BOM.
# Используются только в spring-boot-starter-platform-bom/build.gradle.
# Prefixed with "bom-" to distinguish from test/build-only versions below.
# ----------------------------------------------------------------------------------
bom-logstash    = "8.1"
bom-commons     = "3.19.0"
bom-uuid        = "6.1.1"
bom-jetbrains   = "26.0.2-1"
bom-grpc        = "0.9.0"
bom-openfeign   = "4.3.0"
bom-logbook     = "4.0.4"
bom-minio       = "8.6.0"
bom-okhttp      = "5.3.2"
bom-resilience  = "2.3.0"
bom-springboot  = "3.5.6"

# ----------------------------------------------------------------------------------
# Тестовые и вспомогательные зависимости (только для сборки/тестирования стартеров)
# ----------------------------------------------------------------------------------
archunit         = "1.3.0"
testcontainers   = "1.21.3"
byte-buddy       = "1.15.10"
blockhound       = "1.0.16.RELEASE"
opentelemetry    = "1.45.0"
awaitility       = "4.3.0"
jedis            = "7.0.0"

[libraries]
archunit-junit5            = { module = "com.tngtech.archunit:archunit-junit5",  version.ref = "archunit" }
testcontainers-core        = { module = "org.testcontainers:testcontainers",     version.ref = "testcontainers" }
testcontainers-junit       = { module = "org.testcontainers:junit-jupiter",      version.ref = "testcontainers" }
testcontainers-postgresql  = { module = "org.testcontainers:postgresql",         version.ref = "testcontainers" }
testcontainers-kafka       = { module = "org.testcontainers:kafka",              version.ref = "testcontainers" }
testcontainers-toxiproxy   = { module = "org.testcontainers:toxiproxy",          version.ref = "testcontainers" }
testcontainers-minio       = { module = "org.testcontainers:minio",              version.ref = "testcontainers" }
byte-buddy                 = { module = "net.bytebuddy:byte-buddy",              version.ref = "byte-buddy" }
blockhound                 = { module = "io.projectreactor.tools:blockhound",    version.ref = "blockhound" }
opentelemetry-api          = { module = "io.opentelemetry:opentelemetry-api",    version.ref = "opentelemetry" }
awaitility                 = { module = "org.awaitility:awaitility",             version.ref = "awaitility" }
jedis                      = { module = "redis.clients:jedis",                   version.ref = "jedis" }

[bundles]
testcontainers = ["testcontainers-core", "testcontainers-junit"]
