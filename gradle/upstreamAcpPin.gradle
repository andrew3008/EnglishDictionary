import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.regex.Pattern
import java.util.zip.ZipFile

class PlatformUpstreamAcpPinSupport {
    static final String ACP_SPI =
            'io.opentelemetry.sdk.autoconfigure.spi.AutoConfigurationCustomizerProvider'
    static final String DESCRIPTOR_PATH = 'inst/META-INF/services/' + ACP_SPI
    static final String PLATFORM_PROVIDER =
            'space.br1440.platform.tracing.otel.javaagent.bootstrap.BootstrapAutoConfigurationCustomizerProvider'
    static final Pattern BINARY_NAME =
            Pattern.compile('^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$')
    static final Pattern SHA256_HEX = Pattern.compile('^[a-f0-9]{64}$')
    static final Set<String> TOP_LEVEL_KEYS = [
            'formatVersion', 'coordinate', 'upstreamSha256', 'upstreamChecksumSource',
            'pinSha256', 'pinCount', 'providers', 'loaderContract'
    ] as Set
    static final String GENERATED_PACKAGE =
            'space.br1440.platform.tracing.otel.javaagent.bootstrap'
    static final String GENERATED_SIMPLE_NAME = 'PinnedUpstreamAcpProviders'

    static String sha256Hex(byte[] bytes) {
        byte[] digest = MessageDigest.getInstance('SHA-256').digest(bytes)
        StringBuilder hex = new StringBuilder(digest.length * 2)
        for (byte value : digest) {
            hex.append(String.format('%02x', value & 0xFF))
        }
        return hex.toString()
    }

    static String pinSha256(Collection<String> names) {
        List<String> sorted = new ArrayList<>(names)
        Collections.sort(sorted)
        StringBuilder preimage = new StringBuilder()
        for (String name : sorted) {
            preimage.append(name).append('\n')
        }
        return sha256Hex(preimage.toString().getBytes(StandardCharsets.UTF_8))
    }

    static List<String> extractProviderNames(File agentJar) {
        List<ExtractedProvider> extracted = extractProviders(agentJar)
        return extracted.collect { it.binaryName }
    }

    static List<ExtractedProvider> extractProviders(File agentJar) {
        ZipFile zip = new ZipFile(agentJar)
        try {
            List<String> acpDescriptors = []
            zip.entries().each { entry ->
                String name = entry.name
                if (name.endsWith('/') ) {
                    return
                }
                if (name.contains('META-INF/services/' + ACP_SPI) || name.endsWith('/' + ACP_SPI)
                        || name == ACP_SPI) {
                    if (name.contains('META-INF/services/' + ACP_SPI)) {
                        acpDescriptors.add(name)
                    }
                }
                if (name.endsWith('.jar')) {
                    throw new GradleException(
                            "Pinned agent unexpectedly contains a nested JAR: ${name}")
                }
            }
            if (acpDescriptors != [DESCRIPTOR_PATH]) {
                throw new GradleException(
                        "ACP descriptor inventory must be exactly ${DESCRIPTOR_PATH}, got ${acpDescriptors}")
            }
            def entry = zip.getEntry(DESCRIPTOR_PATH)
            if (entry == null) {
                throw new GradleException("ACP descriptor is missing: ${DESCRIPTOR_PATH}")
            }
            byte[] raw = zip.getInputStream(entry).bytes
            return parseDescriptor(raw, DESCRIPTOR_PATH)
        } finally {
            zip.close()
        }
    }

    static List<ExtractedProvider> parseDescriptor(byte[] raw, String descriptorPath) {
        if (raw.length >= 3 && (raw[0] & 0xFF) == 0xEF && (raw[1] & 0xFF) == 0xBB && (raw[2] & 0xFF) == 0xBF) {
            throw new GradleException("ACP descriptor must not have a UTF-8 BOM: ${descriptorPath}")
        }
        String text = new String(raw, StandardCharsets.UTF_8)
        if (text.contains('\r')) {
            throw new GradleException("ACP descriptor must be LF-only: ${descriptorPath}")
        }
        LinkedHashSet<String> names = new LinkedHashSet<>()
        text.split('\n', -1).each { String line ->
            int comment = line.indexOf('#')
            String name = (comment >= 0 ? line.substring(0, comment) : line).trim()
            if (name.isEmpty()) {
                return
            }
            if (!BINARY_NAME.matcher(name).matches()) {
                throw new GradleException("Malformed ACP binary name '${name}' in ${descriptorPath}")
            }
            if (!names.add(name)) {
                throw new GradleException("Duplicate ACP declaration '${name}' in ${descriptorPath}")
            }
            if (name == PLATFORM_PROVIDER) {
                throw new GradleException("Platform provider must not appear in upstream pin")
            }
        }
        if (names.isEmpty()) {
            throw new GradleException("ACP descriptor is empty: ${descriptorPath}")
        }
        List<String> sorted = new ArrayList<>(names)
        Collections.sort(sorted)
        return sorted.collect { String binaryName ->
            new ExtractedProvider(binaryName: binaryName, containerEntry: 'inst', descriptorPath: descriptorPath)
        }
    }

    static Map parseBaseline(byte[] raw) {
        if (raw.length >= 3 && (raw[0] & 0xFF) == 0xEF && (raw[1] & 0xFF) == 0xBB && (raw[2] & 0xFF) == 0xBF) {
            throw new GradleException('Pin baseline JSON must not have a UTF-8 BOM')
        }
        String text = new String(raw, StandardCharsets.UTF_8)
        if (text.contains('\r')) {
            throw new GradleException('Pin baseline JSON must be LF-only')
        }
        Object parsed = new StrictJsonObjectParser(text).parseRoot(TOP_LEVEL_KEYS)
        if (!(parsed instanceof Map)) {
            throw new GradleException('Pin baseline JSON root must be an object')
        }
        Map document = (Map) parsed
        if (document.keySet() != TOP_LEVEL_KEYS) {
            throw new GradleException(
                    "Pin baseline root keys ${document.keySet()} must equal ${TOP_LEVEL_KEYS}")
        }
        if (document.formatVersion != 1) {
            throw new GradleException("Unsupported pin formatVersion: ${document.formatVersion}")
        }
        if (!(document.coordinate instanceof String) || ((String) document.coordinate).isBlank()) {
            throw new GradleException('Pin baseline coordinate is required')
        }
        ['upstreamSha256', 'pinSha256'].each { String key ->
            if (!(document[key] instanceof String) || !SHA256_HEX.matcher((String) document[key]).matches()) {
                throw new GradleException("Pin baseline ${key} must be a lowercase SHA-256 hex")
            }
        }
        if (!(document.pinCount instanceof Number)) {
            throw new GradleException('Pin baseline pinCount must be a number')
        }
        if (!(document.providers instanceof List)) {
            throw new GradleException('Pin baseline providers must be an array')
        }
        List providers = (List) document.providers
        if (((Number) document.pinCount).intValue() != providers.size()) {
            throw new GradleException('Pin baseline pinCount does not match providers.size()')
        }
        List<String> names = []
        String previous = null
        providers.each { Object item ->
            if (!(item instanceof Map)) {
                throw new GradleException('Pin baseline provider must be an object')
            }
            Map provider = (Map) item
            String binaryName = provider.binaryName
            if (!(binaryName instanceof String) || !BINARY_NAME.matcher(binaryName).matches()) {
                throw new GradleException("Pin baseline provider binaryName is malformed: ${binaryName}")
            }
            if (names.contains(binaryName)) {
                throw new GradleException("Pin baseline contains duplicate provider ${binaryName}")
            }
            if (previous != null && previous >= binaryName) {
                throw new GradleException("Pin baseline providers are not sorted: ${binaryName}")
            }
            previous = binaryName
            names.add(binaryName)
        }
        if (pinSha256(names) != document.pinSha256) {
            throw new GradleException('Pin baseline pinSha256 does not match provider names')
        }
        return document
    }

    static String generatedJava(Map baseline) {
        List<String> names = ((List) baseline.providers).collect { ((Map) it).binaryName }
        StringBuilder java = new StringBuilder()
        java.append("package ${GENERATED_PACKAGE};\n\n")
        java.append("import java.util.Set;\n\n")
        java.append("/** Сгенерировано verifyUpstreamAcpPin из reviewed baseline. Не редактировать вручную. */\n")
        java.append("final class ${GENERATED_SIMPLE_NAME} {\n\n")
        java.append("    static final String UPSTREAM_AGENT_COORDINATE =\n")
        java.append("            \"${escape(baseline.coordinate)}\";\n")
        java.append("    static final String UPSTREAM_AGENT_SHA256 =\n")
        java.append("            \"${escape(baseline.upstreamSha256)}\";\n")
        java.append("    static final String PIN_SHA256 =\n")
        java.append("            \"${escape(baseline.pinSha256)}\";\n")
        java.append("    static final int PIN_COUNT = ${baseline.pinCount};\n")
        java.append("    static final int PIN_FORMAT_VERSION = ${baseline.formatVersion};\n\n")
        java.append("    static final Set<String> NAMES = Set.of(\n")
        names.eachWithIndex { String name, int index ->
            java.append("            \"${escape(name)}\"")
            java.append(index + 1 < names.size() ? ",\n" : "\n")
        }
        java.append("    );\n\n")
        java.append("    private ${GENERATED_SIMPLE_NAME}() {\n")
        java.append("    }\n")
        java.append("}\n")
        return java.toString()
    }

    static String escape(Object value) {
        return String.valueOf(value).replace('\\', '\\\\').replace('"', '\\"')
    }

    static class ExtractedProvider {
        String binaryName
        String containerEntry
        String descriptorPath
    }

    static class StrictJsonObjectParser {
        private final String text
        private int index

        StrictJsonObjectParser(String text) {
            this.text = text
            this.index = 0
        }

        Object parseRoot(Set<String> allowedKeys) {
            Object parsed = parseObject(allowedKeys)
            skipWhitespace()
            if (index != text.length()) {
                throw new GradleException('Trailing content is not accepted in pin baseline JSON')
            }
            return parsed
        }

        Object parseObject(Set<String> allowedKeys) {
            skipWhitespace()
            expect('{')
            LinkedHashMap<String, Object> object = new LinkedHashMap<>()
            skipWhitespace()
            if (peek() == '}') {
                index++
                return object
            }
            while (true) {
                skipWhitespace()
                String key = parseString()
                if (!allowedKeys.contains(key)) {
                    throw new GradleException("Unknown pin baseline field: ${key}")
                }
                if (object.containsKey(key)) {
                    throw new GradleException("Duplicate pin baseline field: ${key}")
                }
                skipWhitespace()
                expect(':')
                skipWhitespace()
                object.put(key, parseValue(key))
                skipWhitespace()
                if (peek() == ',') {
                    index++
                    continue
                }
                expect('}')
                return object
            }
        }

        private Object parseValue(String key) {
            char ch = peek()
            if (ch == '{') {
                if (key == 'upstreamChecksumSource') {
                    return parseObject(['type', 'reference'] as Set)
                }
                if (key == 'loaderContract') {
                    return parseObject(['repository', 'tag', 'commit', 'sources', 'conclusionSha256'] as Set)
                }
                if (key == 'sources') {
                    return parseObject(['path', 'sha256'] as Set)
                }
                return parseObject(['binaryName', 'containerEntry', 'descriptorPath'] as Set)
            }
            if (ch == '[') {
                return parseArray(key)
            }
            if (ch == '"') {
                return parseString()
            }
            if (ch == '-' || Character.isDigit(ch)) {
                return parseNumber()
            }
            throw new GradleException("Unsupported JSON value at ${index}")
        }

        private List parseArray(String key) {
            expect('[')
            List values = []
            skipWhitespace()
            if (peek() == ']') {
                index++
                return values
            }
            while (true) {
                skipWhitespace()
                values.add(parseValue(key))
                skipWhitespace()
                if (peek() == ',') {
                    index++
                    continue
                }
                expect(']')
                return values
            }
        }

        private String parseString() {
            expect('"')
            StringBuilder value = new StringBuilder()
            while (index < text.length()) {
                char ch = text.charAt(index++)
                if (ch == '"') {
                    return value.toString()
                }
                if (ch == '\\') {
                    throw new GradleException('Escaped JSON strings are not accepted in pin baseline')
                }
                if (ch < 0x20) {
                    throw new GradleException('Control characters are not accepted in pin baseline strings')
                }
                value.append(ch)
            }
            throw new GradleException('Unterminated JSON string in pin baseline')
        }

        private Number parseNumber() {
            int start = index
            if (peek() == '-') {
                index++
            }
            while (index < text.length() && Character.isDigit(text.charAt(index))) {
                index++
            }
            return Integer.parseInt(text.substring(start, index))
        }

        private void skipWhitespace() {
            while (index < text.length()) {
                char ch = text.charAt(index)
                if (ch == ' ' || ch == '\n' || ch == '\t') {
                    index++
                    continue
                }
                return
            }
        }

        private char peek() {
            if (index >= text.length()) {
                throw new GradleException('Unexpected end of pin baseline JSON')
            }
            return text.charAt(index)
        }

        private void expect(String expected) {
            if (expected == null || expected.length() != 1) {
                throw new GradleException("JSON expect() requires a single character")
            }
            char wanted = expected.charAt(0)
            char actual = peek()
            if (actual != wanted) {
                throw new GradleException("Expected '${wanted}' in pin baseline JSON, got '${actual}'")
            }
            index++
        }
    }
}

abstract class VerifyUpstreamAcpPin extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getUpstreamAgentJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getBaselineJson()

    @Input
    abstract Property<String> getExpectedCoordinate()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void verify() {
        File agentJar = upstreamAgentJar.get().asFile
        File baselineFile = baselineJson.get().asFile
        Map baseline = PlatformUpstreamAcpPinSupport.parseBaseline(baselineFile.bytes)
        if (baseline.coordinate != expectedCoordinate.get()) {
            throw new GradleException(
                    "Pin coordinate ${baseline.coordinate} does not match ${expectedCoordinate.get()}")
        }
        String actualSha = PlatformUpstreamAcpPinSupport.sha256Hex(agentJar.bytes)
        if (actualSha != baseline.upstreamSha256) {
            throw new GradleException(
                    "Resolved upstream agent SHA-256 ${actualSha} does not match reviewed ${baseline.upstreamSha256}")
        }
        List extracted = PlatformUpstreamAcpPinSupport.extractProviders(agentJar)
        List baselineNames = ((List) baseline.providers).collect { ((Map) it).binaryName }
        List extractedNames = extracted.collect { it.binaryName }
        if (extractedNames != baselineNames) {
            throw new GradleException(
                    "Extracted ACP names ${extractedNames} do not match reviewed baseline ${baselineNames}")
        }
        File packageDir = new File(
                outputDirectory.get().asFile,
                PlatformUpstreamAcpPinSupport.GENERATED_PACKAGE.replace('.', '/')
        )
        if (!packageDir.exists() && !packageDir.mkdirs()) {
            throw new GradleException("Cannot create generated pin directory: ${packageDir}")
        }
        File javaFile = new File(packageDir, PlatformUpstreamAcpPinSupport.GENERATED_SIMPLE_NAME + '.java')
        javaFile.setText(PlatformUpstreamAcpPinSupport.generatedJava(baseline), 'UTF-8')
    }
}

abstract class GenerateUpstreamAcpPinCandidate extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getUpstreamAgentJar()

    @Input
    abstract Property<String> getExpectedCoordinate()

    @Input
    abstract Property<String> getExpectedUpstreamSha256()

    @OutputFile
    abstract RegularFileProperty getCandidateJson()

    @TaskAction
    void generate() {
        File agentJar = upstreamAgentJar.get().asFile
        String actualSha = PlatformUpstreamAcpPinSupport.sha256Hex(agentJar.bytes)
        String expectedSha = expectedUpstreamSha256.get().trim().toLowerCase()
        if (!PlatformUpstreamAcpPinSupport.SHA256_HEX.matcher(expectedSha).matches()) {
            throw new GradleException('expectedUpstreamAgentSha256 must be a lowercase SHA-256 hex')
        }
        if (actualSha != expectedSha) {
            throw new GradleException(
                    "Resolved upstream agent SHA-256 ${actualSha} does not match supplied ${expectedSha}")
        }
        List extracted = PlatformUpstreamAcpPinSupport.extractProviders(agentJar)
        List<String> names = extracted.collect { it.binaryName }
        String pinSha = PlatformUpstreamAcpPinSupport.pinSha256(names)
        StringBuilder json = new StringBuilder()
        json.append('{\n')
        json.append('  "formatVersion": 1,\n')
        json.append("  \"coordinate\": \"${expectedCoordinate.get()}\",\n")
        json.append("  \"upstreamSha256\": \"${actualSha}\",\n")
        json.append('  "upstreamChecksumSource": {\n')
        json.append('    "type": "OPERATOR_SUPPLIED",\n')
        json.append("    \"reference\": \"-PexpectedUpstreamAgentSha256\"\n")
        json.append('  },\n')
        json.append("  \"pinSha256\": \"${pinSha}\",\n")
        json.append("  \"pinCount\": ${names.size()},\n")
        json.append('  "providers": [\n')
        extracted.eachWithIndex { provider, int index ->
            json.append('    {\n')
            json.append("      \"binaryName\": \"${provider.binaryName}\",\n")
            json.append("      \"containerEntry\": \"${provider.containerEntry}\",\n")
            json.append("      \"descriptorPath\": \"${provider.descriptorPath}\"\n")
            json.append(index + 1 < extracted.size() ? '    },\n' : '    }\n')
        }
        json.append('  ]\n')
        json.append('}\n')
        File output = candidateJson.get().asFile
        output.parentFile.mkdirs()
        output.setText(json.toString(), 'UTF-8')
    }
}

ext.platformUpstreamAcpPinSupportType = PlatformUpstreamAcpPinSupport
ext.verifyUpstreamAcpPinType = VerifyUpstreamAcpPin
ext.generateUpstreamAcpPinCandidateType = GenerateUpstreamAcpPinCandidate
