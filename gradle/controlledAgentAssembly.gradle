class ControlledAgentTextSupport {
    static String decodeUtf8(byte[] bytes, String description) {
        try {
            return StandardCharsets.UTF_8.newDecoder()
                    .onMalformedInput(CodingErrorAction.REPORT)
                    .onUnmappableCharacter(CodingErrorAction.REPORT)
                    .decode(ByteBuffer.wrap(bytes))
                    .toString()
        } catch (CharacterCodingException exception) {
            throw new GradleException("${description} must be valid UTF-8", exception)
        }
    }
}

class ControlledAgentAssemblyPolicy {
    int formatVersion
    String distributionGroup
    String distributionArtifact
    String upstreamCoordinate
