plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

configurations {
    configServerDelivery {
        canBeConsumed = false
        canBeResolved = true
    }
    configClientDelivery {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation enforcedPlatform('org.springframework.cloud:spring-cloud-dependencies:2025.0.0')
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    configServerDelivery enforcedPlatform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    configServerDelivery enforcedPlatform('org.springframework.cloud:spring-cloud-dependencies:2025.0.0')
    configServerDelivery 'org.springframework.cloud:spring-cloud-config-server'
    configServerDelivery 'org.springframework.cloud:spring-cloud-config-monitor'
    configServerDelivery 'org.springframework.cloud:spring-cloud-starter-bus-kafka'

    configClientDelivery enforcedPlatform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    configClientDelivery enforcedPlatform('org.springframework.cloud:spring-cloud-dependencies:2025.0.0')
    configClientDelivery 'org.springframework.cloud:spring-cloud-starter-config'
    configClientDelivery 'org.springframework.cloud:spring-cloud-starter-bus-kafka'
}

static def moduleVersions(Configuration configuration, String moduleName) {
    return configuration.incoming.resolutionResult.allComponents
            .findAll { it.moduleVersion?.name == moduleName }
            .collect { it.moduleVersion.version }
            .findAll { it != null }
}

static def assertSpringBoot3516(Configuration configuration) {
    def versions = moduleVersions(configuration, 'spring-boot')
    if (versions.isEmpty()) {
        throw new GradleException('spring-boot not found on classpath')
    }
    if (versions != ['3.5.16']) {
        throw new GradleException("spring-boot must resolve exactly to 3.5.16, found: ${versions}")
    }
}

static def assertSpringCloud43(Configuration configuration, String moduleName) {
    def versions = moduleVersions(configuration, moduleName)
    if (versions.isEmpty()) {
        throw new GradleException("${moduleName} not found on classpath")
    }
    if (!versions.every { it.startsWith('4.3.') }) {
        throw new GradleException("${moduleName} must resolve to 4.3.x, found: ${versions}")
    }
}

static def assertNoSpringCloudContext415(Configuration configuration, String configurationName) {
    def versions = moduleVersions(configuration, 'spring-cloud-context')
    if (versions.contains('4.1.5')) {
        throw new GradleException(
                "spring-cloud-context:4.1.5 must not appear on ${configurationName}, found: ${versions}")
    }
}

static def assertExactVersion(
        Configuration configuration,
        String moduleName,
        String expectedVersion
) {
    def versions = moduleVersions(configuration, moduleName)
    if (versions != [expectedVersion]) {
        throw new GradleException(
                "${moduleName} on ${configuration.name} must resolve exactly to "
                        + "${expectedVersion}, found: ${versions}")
    }
}

tasks.register('verifyApprovedStackResolution') {
    doLast {
        [configurations.compileClasspath, configurations.runtimeClasspath].each { configuration ->
            assertSpringBoot3516(configuration)
            assertSpringCloud43(configuration, 'spring-cloud-context')
            assertSpringCloud43(configuration, 'spring-cloud-config-client')
            assertNoSpringCloudContext415(configuration, configuration.name)
        }

        [configurations.configServerDelivery, configurations.configClientDelivery].each { configuration ->
            assertSpringBoot3516(configuration)
            assertSpringCloud43(configuration, 'spring-cloud-context')
            assertNoSpringCloudContext415(configuration, configuration.name)
            assertExactVersion(configuration, 'spring-cloud-bus', '4.3.0')
            assertExactVersion(configuration, 'spring-cloud-stream', '4.3.0')
            assertExactVersion(configuration, 'spring-cloud-stream-binder-kafka', '4.3.0')
            assertExactVersion(configuration, 'spring-kafka', '3.3.16')
            assertExactVersion(configuration, 'kafka-clients', '3.9.2')
            assertExactVersion(configuration, 'spring-integration-core', '6.5.10')
        }

        assertExactVersion(configurations.configServerDelivery, 'spring-cloud-config-server', '4.3.0')
        assertExactVersion(configurations.configServerDelivery, 'spring-cloud-config-monitor', '4.3.0')
        assertExactVersion(configurations.configClientDelivery, 'spring-cloud-config-client', '4.3.0')
    }
}
