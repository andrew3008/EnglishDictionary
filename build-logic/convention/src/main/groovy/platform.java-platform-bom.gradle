// =============================================================================
//  Convention-плагин `platform.java-platform-bom`
// =============================================================================
//
//  Назначение
//  ----------
//  Конфигурирует модуль как платформенный BOM (Bill of Materials),
//  публикуемый в корпоративный Nexus. Применяется к единственному
//  модулю `:spring-boot-starter-platform-bom`.
//
//  allowDependencies
//  -----------------
//  Включается, поскольку BOM импортирует Spring Boot BOM выражением
//  `api platform('org.springframework.boot:spring-boot-dependencies:...')`.
//  По умолчанию `java-platform` запрещает любые зависимости кроме
//  `constraints`; данный флаг разрешает строго это импортирование.
// =============================================================================

plugins {
    id 'java-platform'
    id 'maven-publish'
}

javaPlatform {
    allowDependencies()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.javaPlatform
        }
    }

    repositories {
        maven {
            name = 'nexus'
            url = version.toString().endsWith('-SNAPSHOT')
                    ? uri('https://n.1440.space/repository/platform-maven-dev')
                    : uri('https://n.1440.space/repository/platform-maven')
            credentials {
                if (version.toString().endsWith('-SNAPSHOT')) {
                    username = System.getenv('NEXUS_USERNAME')
                    password = System.getenv('NEXUS_PASSWORD')
                } else {
                    username = System.getenv('PROD_NEXUS_USERNAME')
                    password = System.getenv('PROD_NEXUS_PASSWORD')
                }
            }
        }
    }
}
