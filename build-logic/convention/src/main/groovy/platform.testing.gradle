// =============================================================================
//  Convention-плагин `platform.testing`
// =============================================================================
//
//  Назначение
//  ----------
//  Стандартизирует конфигурацию задач типа `Test` во всех модулях платформы:
//   * выполнение через JUnit Platform (JUnit 5);
//   * единый формат логирования жизненного цикла и стек-трейсов исключений;
//   * политику запуска тестов в составе сборки монорепозитория.
//
//  Применимость
//  ------------
//  Плагин предполагает, что в модуле уже подключён `java-library`
//  (как правило, через `platform.java-library-publish`); собственных
//  Java-плагинов он не активирует во избежание дублирующего конфигурирования.
//
//  Политика запуска тестов
//  -----------------------
//  По умолчанию задачи `Test` отключены в составе обычной сборки
//  (`./gradlew build`) — это снижает время прохождения CI на этапах,
//  не предполагающих исполнение тестов по требованию DevOps. Включение выполняется явно:
//   1. передачей флага `-PrunTests` (например, на отдельной стадии CI);
//   2. вызовом любой задачи, имя которой содержит подстроку `test`
//      без учёта регистра (`test`, `integrationTest`, `:module:test` и т. п.),
//      за исключением технической задачи `testClasses`.
//
//  Единые параметры JVM и логирования для всех задач типа `Test`
//  ----------------------------------------------------------------
//  Лимиты кучи, таймаут, набор JVM-флагов и формат `testLogging` задаются здесь
//  один раз, чтобы не дублировать блок `tasks.named('test', Test) { ... }` в каждом
//  модуле. Исключения (конкретный `timeout`, `environment`, `exclude`, дополнительные
//  `jvmArgs` для BlockHound и т. п.) остаются в `build.gradle` соответствующего модуля.
// =============================================================================

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    minHeapSize = '512m'
    maxHeapSize = '2048m'
    jvmArgs(
            '-XX:+EnableDynamicAgentLoading',
            '-XX:+UseParallelGC',
            '-Dfile.encoding=UTF-8',
            '-Duser.timezone=UTC'
    )
    timeout = Duration.ofMinutes(10)

    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
        showStackTraces true
        showStandardStreams false
    }

    enabled = project.hasProperty('runTests') ||
            gradle.startParameter.taskNames.any { taskName ->
                (taskName ==~ /(?i).*test.*/ || taskName.endsWith(':integrationTest')) &&
                        taskName != 'testClasses'
            }
}
