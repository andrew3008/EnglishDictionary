import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
    id 'com.github.spotbugs' version '6.1.2'
}

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

spotbugs {
    toolVersion = '4.8.6'
    effort = Effort.MAX
    reportLevel = Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

dependencies {
    // API
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'space.br1440.platform:error-handling-model'

    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'com.zaxxer:HikariCP'

    api 'org.springframework:spring-tx'
    api 'org.springframework:spring-aop'


    // Авто-конфигурация (публичный API стартера)
    api 'org.springframework.boot:spring-boot-autoconfigure'

    // === Optional / conditional dependencies (compileOnly) ===

    // JPA / jOOQ
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-jooq'

    // Observability
    compileOnly 'io.micrometer:micrometer-core'
    compileOnly 'io.micrometer:micrometer-observation'

    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'

    compileOnly 'org.projectlombok:lombok'

    // Annotation Processors
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'


    // === Test infrastructure ===

    // Базовые тестовые зависимости
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Полный стек persistence / web для сценариев IT
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Observability
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'io.micrometer:micrometer-observation'
    testImplementation 'io.micrometer:micrometer-observation-test'

    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'

    // Встраиваемая БД для быстрых тестов без Docker.
    testImplementation 'com.h2database:h2'

    // Разделяемые тестовые зависимости — из каталога `gradle/libs.versions.toml`
    testImplementation libs.bundles.testcontainers
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.toxiproxy

    testImplementation 'org.postgresql:postgresql'
    testImplementation libs.awaitility
    testImplementation libs.archunit.junit5

    testImplementation 'ch.qos.logback:logback-classic'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('spotbugsMain') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.named('test', Test) {
    exclude 'space/br1440/platform/datasource/it/**'

    systemProperty 'testcontainers.reuse.enable', 'true'
    jvmArgs '-XX:+EnableDynamicAgentLoading', '-Djdk.attach.allowAttachSelf=true'
    timeout = Duration.ofMinutes(15)
}

tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    include 'space/br1440/platform/datasource/it/**'

    systemProperty 'testcontainers.reuse.enable', 'true'
    timeout = Duration.ofMinutes(45)
    maxParallelForks = 1
}
