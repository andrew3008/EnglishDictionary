plugins {
    id 'platform.java-library-publish'
    id 'platform.testing'
}

group = rootProject.group
version = rootProject.version

description = 'Генерация уникальных идентификаторов платформы: UUID v7 и uid1440.'

// Имя JAR фиксируем: Gradle-проект с префиксом platform-common, артефакт Maven — spring-boot-starter-uid1440
tasks.named('jar', Jar).configure {
    archiveBaseName = 'spring-boot-starter-uid1440'
}

publishing {
    publications.named('mavenJava', MavenPublication).configure {
        artifactId = 'spring-boot-starter-uid1440'
        pom.description.set(project.description)
    }
}

dependencies {
    // UUID v7 / генерация идентификаторов — версия из платформенного BOM
    api 'com.github.f4b6a3:uuid-creator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
}
