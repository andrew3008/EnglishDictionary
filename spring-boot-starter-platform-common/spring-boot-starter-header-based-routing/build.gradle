plugins{
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Platform BOM
    api platform(project(":spring-boot-starter-platform-bom"))
    compileOnly platform(project(":spring-boot-starter-platform-bom"))
    annotationProcessor platform(project(":spring-boot-starter-platform-bom"))
    testImplementation platform(project(":spring-boot-starter-platform-bom"))

    compileOnly 'org.springframework.boot:spring-boot'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework:spring-webflux'
    compileOnly 'org.springframework.cloud:spring-cloud-openfeign-core'
    compileOnly 'io.grpc:grpc-api'
    compileOnly 'org.springframework.grpc:spring-grpc-server-web-spring-boot-starter'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
