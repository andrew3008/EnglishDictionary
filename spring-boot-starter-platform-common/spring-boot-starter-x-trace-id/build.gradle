plugins {
    id 'platform.java-library-publish'
    id 'platform.testing'
}

group = rootProject.group
version = rootProject.version

description = 'Фильтры и автоконфигурация для заголовка X-Trace-Id (Servlet, Micrometer Tracing).'

tasks.named('jar', Jar).configure {
    archiveBaseName = 'spring-boot-starter-x-trace-id'
}

publishing {
    publications.named('mavenJava', MavenPublication).configure {
        artifactId = 'spring-boot-starter-x-trace-id'
        pom.description.set(project.description)
    }
}

dependencies {
    // Рантайм-зависимости стартера; micrometer-tracing версионируется Spring Boot BOM
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-web'
    implementation 'io.micrometer:micrometer-tracing'

    compileOnly 'org.slf4j:slf4j-api'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.springframework:spring-webmvc'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Тесты: Brave + mock-tracer из micrometer-tracing-test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-brave'
    testImplementation 'io.micrometer:micrometer-tracing-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation libs.archunit.junit5
}
