java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('jar') { enabled = false }
tasks.named('javadoc') { enabled = false }

// Отключаем публикацию именно этого узла, без отключения дочерних
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar {
                enabled = false
            }
        }
    }
}

dependencies {
    // Platform BOM
    api platform(project(":spring-boot-starter-platform-bom"))
    compileOnly platform(project(":spring-boot-starter-platform-bom"))
    annotationProcessor platform(project(":spring-boot-starter-platform-bom"))
    testImplementation platform(project(":spring-boot-starter-platform-bom"))

    api("com.github.f4b6a3:uuid-creator")
}


subprojects {
    dependencies {
        implementation project(':spring-boot-starter-platform-common')
        api("com.github.f4b6a3:uuid-creator")
    }
}
