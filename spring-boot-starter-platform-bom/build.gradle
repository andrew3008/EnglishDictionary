// =============================================================================
//  Платформенный BOM (Bill of Materials)
// =============================================================================
//
//  Назначение
//  ----------
//  Артефакт публикуется как POM-only-модуль и подключается потребителями платформы
//  выражением `api platform(...)` (Gradle). За счёт этого версии управляемых зависимостей 
//  выравниваются между всеми сервисами, использующими платформенные стартеры.
//
//  Импортирует Spring Boot BOM (`spring-boot-dependencies`) и расширяет его
//  набором ограничений (constraints), необходимых платформе вне контракта Spring Boot. 
//  Задавать в `constraints` зависимости, которые уже управляет Spring Boot BOM, 
//  не следует — это создаёт дрейф версий между релизами Boot.
//
//  Критерий включения зависимости
//  ------------------------------
//  В `constraints` помещаются только те версии, что используются в `src/main` 
//  хотя бы одного платформенного стартера (конфигурации `api`, `implementation`, `compileOnly`). 
//  Зависимости, востребованные исключительно тестовым кодом стартеров (`testImplementation`, `testRuntimeOnly`), 
//  в BOM не публикуются — их версии хранятся в `gradle/libs.versions.toml` и не предлагаются потребителям.
//
//  Регламент обновления
//  --------------------
//  1. Перед добавлением констрейнта убедиться, что зависимость присутствует
//     в `src/main` хотя бы одного платформенного стартера. Если зависимость
//     используется только в тестовом коде (`src/test`), её версия задаётся
//     в каталоге версий `gradle/libs.versions.toml`, а не в этом BOM.
//  2. Перед изменением версии проверить отсутствие конфликта с управлением
//     Spring Boot BOM (`./gradlew dependencyInsight`).
//  3. Любое изменение констрейнтов должно сопровождаться повышением версии
//     BOM согласно политике совместимости платформы.
//  4. Для констрейнтов, ссылающихся на модули этого же монорепозитория, версия
//     по умолчанию задаётся подстановкой `${rootProject.version}` и не должна
//     указываться литералом — иначе при подъёме общей версии платформы получают
//     расхождение между опубликованным BOM и фактическими артефактами.
//     Исключение — артефакты с независимым жизненным циклом (версии в каталоге
//     `gradle/libs.versions.toml`, напр. `errorHandlingModel` для модуля
//     `error-handling-model`). Для них в `constraints` указывается явная
//     версия через `libs.versions.<ключ>.get()` — см. блок «Внутренние контрактные модули».
//
//  Версии внутренних модулей с независимым жизненным циклом
//  --------------------------------------------------------
//  Единственный источник истины для версий таких модулей — каталог
//  `gradle/libs.versions.toml`. Один и тот же ключ используется в двух
//  местах монорепозитория и из них же подтягивается в BOM:
//   * в `build.gradle` самого модуля — как `version = libs.versions.<ключ>.get()`;
//   * в этом BOM — как `api "space.br1440.platform:<artifactId>:${libs.versions.<ключ>.get()}"`.
//  Благодаря единому ключу версия опубликованного артефакта и значение
//  констрейнта BOM не расходятся, а потребители платформы подключают
//  такой модуль без явной версии — её навязывает BOM. Каталог версий
//  (`libs.versions.toml`) потребителям не доставляется.
// =============================================================================

plugins {
    id 'platform.java-platform-bom'
}

dependencies {
    constraints {
        // ---------------------------------------------------------------------
        // Логирование и диагностика
        // ---------------------------------------------------------------------
        api "net.logstash.logback:logstash-logback-encoder:${libs.versions.bom.logstash.get()}"

        // ---------------------------------------------------------------------
        // Общие утилиты и инструменты сборки
        // ---------------------------------------------------------------------
        api "org.apache.commons:commons-lang3:${libs.versions.bom.commons.get()}"
        api "com.github.f4b6a3:uuid-creator:${libs.versions.bom.uuid.get()}"

        // ---------------------------------------------------------------------
        // Аннотации `@NotNull` / `@Nullable`
        // ---------------------------------------------------------------------
        api "org.jetbrains:annotations:${libs.versions.bom.jetbrains.get()}"

        // ---------------------------------------------------------------------
        // Интеграция gRPC
        // ---------------------------------------------------------------------
        api "org.springframework.grpc:spring-grpc-server-web-spring-boot-starter:${libs.versions.bom.grpc.get()}"

        // ---------------------------------------------------------------------
        // Spring Cloud OpenFeign (нет в spring-boot-dependencies — нужен явный constraint)
        // ---------------------------------------------------------------------
        api "org.springframework.cloud:spring-cloud-openfeign-core:${libs.versions.bom.openfeign.get()}"

        // ---------------------------------------------------------------------
        // Внутренние контрактные модули платформы (модели данных, API, SPI),
        // на которые опираются стартеры и прикладные сервисы.
        // Версии берутся из libs.versions.toml или rootProject.version согласно регламенту.
        // ---------------------------------------------------------------------
        api "space.br1440.platform:error-handling-model:${libs.versions.errorHandlingModel.get()}"
        api "space.br1440.platform:tracing-api:${rootProject.version}"

        // ---------------------------------------------------------------------
        // Zalando Logbook
        // ---------------------------------------------------------------------
        api "org.zalando:logbook-core:${libs.versions.bom.logbook.get()}"
        api "org.zalando:logbook-servlet:${libs.versions.bom.logbook.get()}"

        // ---------------------------------------------------------------------
        // Сторонние интеграционные клиенты
        // ---------------------------------------------------------------------
        api "io.minio:minio:${libs.versions.bom.minio.get()}"
        api "com.squareup.okhttp3:okhttp:${libs.versions.bom.okhttp.get()}"
        api "io.github.resilience4j:resilience4j-timelimiter:${libs.versions.bom.resilience.get()}"

        // ---------------------------------------------------------------------
        // Prometheus client (io.prometheus:prometheus-metrics-*)
        // ---------------------------------------------------------------------
        // Override Spring Boot 3.5.6 BOM: spring-boot-dependencies задаёт
        // prometheus-metrics-exposition-textformats=1.3.10, тогда как остальное
        // семейство io.prometheus:prometheus-metrics-* приходит
        // на версии 1.3.6. Выравнивание семьи на 1.3.6, чтобы устранить
        // рассинхрон версий внутри одной группы артефактов у потребителей,
        // подключающих micrometer-registry-prometheus.
        api "io.prometheus:prometheus-metrics-exposition-textformats:${libs.versions.bom.prometheus.get()}"
    }

    // ---------------------------------------------------------------------
    // Официальный BOM Spring Boot, который задаёт согласованные версии
    // управляемых артефактов релиза Spring Boot — ядра Spring Framework и Spring Boot,
    // Jackson-BOM, Micrometer и иных сопутствующих библиотек.
    // ---------------------------------------------------------------------
    api platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.bom.springboot.get()}")
}
