plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    constraints {
        //Logbook
        api 'org.zalando:logbook-core:3.12.2'
        api 'org.zalando:logbook-servlet:3.12.2'
        api 'org.zalando:logbook-json:3.12.2'

        //SLF4J и logging
        api 'org.slf4j:slf4j-api:2.0.17'
        api 'net.logstash.logback:logstash-logback-encoder:8.1'
        api 'org.aspectj:aspectjweaver:1.9.24'

        //Jackson
        api 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
        api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0'

        //Lombok
        api 'org.projectlombok:lombok:1.18.38'

        //Common (Security)
        api 'org.apache.commons:commons-lang3:3.19.0'

        //annotationProcessor
        api 'org.springframework.boot:spring-boot-configuration-processor:3.5.5'

        api 'org.springframework.grpc:spring-grpc-server-web-spring-boot-starter:0.6.0'

        //Common
        //uid1440
        api 'com.github.f4b6a3:uuid-creator:6.1.1'

        //Header-based routing
        api 'org.springframework:spring-web:6.2.3'
        api 'org.springframework:spring-webflux:6.2.3'
        api 'org.springframework.cloud:spring-cloud-openfeign-core:4.2.1'
        api 'io.grpc:grpc-api:1.71.0'
        api 'org.springframework.grpc:spring-grpc-client-spring-boot-starter:0.11.0'
        api 'org.springframework.grpc:spring-grpc-server-web-spring-boot-starter:0.11.0'
        api 'org.springframework.boot:spring-boot-configuration-processor:3.4.3'

    }
    // объявляем constraints (версии) для всех зависимостей
    api platform('org.springframework.boot:spring-boot-dependencies:3.5.5')

}