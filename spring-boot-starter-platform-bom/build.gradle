plugins {
    id 'platform.java-platform-publish'
}

dependencies {
    api platform("space.br1440.platform:platform-bom:${libs.versions.platformBom.get()}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${libs.versions.bom.springcloud.get()}")
    api platform("io.opentelemetry:opentelemetry-bom:${libs.versions.bom.opentelemetry.get()}")
    api platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${libs.versions.bom.otelinstrumentation.get()}")

    constraints {
        // ============================================================
        // Внешние библиотеки, не покрытые импортированными BOM
        // ============================================================

        // платформенные контракты вне монорепозитория
        api "space.br1440.platform:error-handling-model:${libs.versions.errorHandlingModel.get()}"

        // экосистема Spring
        api "org.springframework.cloud:spring-cloud-openfeign-core:${libs.versions.bom.openfeign.get()}"
        api "org.springframework.grpc:spring-grpc-server-web-spring-boot-starter:${libs.versions.bom.grpc.get()}"

        // экосистема OpenTelemetry
        api "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api:${libs.versions.bom.otelextension.get()}"

        // логирование
        api "net.logstash.logback:logstash-logback-encoder:${libs.versions.bom.logstash.get()}"
        api "org.zalando:logbook-core:${libs.versions.bom.logbook.get()}"
        api "org.zalando:logbook-servlet:${libs.versions.bom.logbook.get()}"

        // инфраструктурные клиенты и утилиты времени выполнения
        api "com.github.f4b6a3:uuid-creator:${libs.versions.bom.uuid.get()}"
        api "com.squareup.okhttp3:okhttp:${libs.versions.bom.okhttp.get()}"
        api "io.github.resilience4j:resilience4j-timelimiter:${libs.versions.bom.resilience.get()}"
        api "io.minio:minio:${libs.versions.bom.minio.get()}"

        // тестирование и архитектурные проверки
        api "com.tngtech.archunit:archunit-junit5:${libs.versions.archunit.get()}"


        // ============================================================
        // Общие модули платформы
        // ============================================================

        // внутренние утилиты, разделяемые модулями монорепозитория
        api "space.br1440.platform.starters:platform-starters-common-util:${rootProject.version}"

        // идентификация запросов и маршрутизация по заголовкам
        api "space.br1440.platform.starters:spring-boot-starter-uid1440:${rootProject.version}"
        api "space.br1440.platform.starters:spring-boot-starter-x-trace-id:${rootProject.version}"
        api "space.br1440.platform.starters:spring-boot-starter-header-based-routing:${rootProject.version}"


        // ============================================================
        // Логи, метрики и проверки состояния
        // ============================================================
        api "space.br1440.platform.starters:spring-boot-starter-platform-logging:1.3.0"
        api "space.br1440.platform.starters:spring-boot-starter-platform-metrics:${rootProject.version}"
        api "space.br1440.platform.starters:spring-boot-starter-platform-health-checks:${rootProject.version}"


        // ============================================================
        // Трассировка
        // ============================================================

        // контракты и ядро времени выполнения
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-api:${rootProject.version}"
        api "space.br1440.platform.starters.tracing:platform-tracing-runtime-policy:${rootProject.version}"
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-otel:${rootProject.version}"

        // автоконфигурация Spring Boot
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-autoconfigure:${rootProject.version}"
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-autoconfigure-webmvc:${rootProject.version}"
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-autoconfigure-webflux:${rootProject.version}"

        // прикладные стартеры
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-mvc:${rootProject.version}"
        api "space.br1440.platform.starters.tracing:spring-boot-starter-platform-tracing-webflux:${rootProject.version}"

        // ============================================================
        // Обработка ошибок
        // ============================================================

        // контракты и ядро
        api "space.br1440.platform.starters.errorhandling:platform-error-handling-core:${rootProject.version}"

        // прикладные стартеры
        api "space.br1440.platform.starters.errorhandling:spring-boot-starter-platform-error-handling-mvc:${rootProject.version}"
        api "space.br1440.platform.starters.errorhandling:spring-boot-starter-platform-error-handling-webflux:${rootProject.version}"


        // ============================================================
        // Прикладная инфраструктура среды исполнения
        // ============================================================

        // безопасность
        api "space.br1440.platform.starters:spring-boot-starter-platform-security:${rootProject.version}"

        // доступ к базам данных
        api "space.br1440.platform.starters:spring-boot-starter-platform-postgres-read-write-split-jdbc:${rootProject.version}"

        // координация экземпляров приложения
        api "space.br1440.platform.starters:spring-boot-starter-platform-leader-election:1.3.0"
    }
}
