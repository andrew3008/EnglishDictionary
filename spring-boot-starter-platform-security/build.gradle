plugins {
    id 'java'
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = rootProject.group
version = rootProject.version



repositories {
    maven {
        url "https://n.1440.space/repository/ums-maven"
        credentials {
            username System.getenv('PROD_NEXUS_USERNAME')
            password System.getenv('PROD_NEXUS_PASSWORD')
        }
    }
    maven {
        url = "https://n.1440.space/repository/platform-maven/"
    }
    maven {
        url = "https://n.1440.space/repository/platform-maven-dev/"
    }
    maven {
        url "https://n.1440.space/repository/plugins.gradle.org-proxy/"
    }
    maven {
        url "https://n.1440.space/repository/repo1.maven.org-proxy"
    }
    mavenLocal()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter")
    api("org.apache.commons:commons-lang3:3.19.0")
    api("com.fasterxml.jackson.core:jackson-databind:2.20.0")
    api("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0")
    api("org.springframework.boot:spring-boot-starter-oauth2-resource-server")
}

test {
    useJUnitPlatform()
}