# Методология: Platform Development API Design, Week 01 (Public Contract Inventory).
# JSON Schema: docs/contracts/public-contract-inventory.schema.json
# Контрактный тест: platform-tracing-api/src/test/java/.../PublicContractInventoryContractTest.java
# Semantic Contract Map (Week 02): docs/contracts/semantic-contract-map.yaml
#
# Governance: изменение status/guarantees supported-* элементов = PR с архитектурным review.
# Pre-production: breaking changes допустимы по project-context; inventory фиксирует intended surface.

version: 1
schema: public-contract-inventory.schema.json
methodology: platform-development-api-design-week-01
updatedAt: "2026-07-30"
semanticContractMap: docs/contracts/semantic-contract-map.yaml

inventories:

  - module: platform-tracing-api
    artifact: space.br1440:platform-tracing-api
    phase: pre-production
    scope:
      summary: >
        Публичный Java/wire контракт платформенной трассировки без Spring и без OpenTelemetry
        compile/runtime зависимостей в consumer classpath.
      javaBaseline: "21"
      springBootBaseline: "3.5+ (via platform starters; not a direct module dependency)"
      runtimeSurfacesExcluded:
        - configuration-properties
        - spring-beans
        - actuator-metrics-defined-in-this-module
    consumers:
      - application-developer
      - platform-module
      - extension-author
      - spring-container
      - sre
      - build-tooling
      - transport-adapter
      - control-plane
    compileApiDependencies:
      - jakarta.annotation:jakarta.annotation-api
      - platform-tracing-bom (dependency management only)

    entries:

      # --- Application entry points -------------------------------------------------

      - id: trace-operations
        surface: java-api
        element: space.br1440.platform.tracing.api.TraceOperations
        elementKind: interface
        consumers: [application-developer, spring-container]
        status: supported-api
        intendedStatus: supported-api
        effectiveUsage: match
        guarantees:
          - "traceContext() returns non-null read-only ActiveTraceContextView"
          - "spans() returns non-null SpanFactory for manual instrumentation"
          - "Correlation helpers open same-thread CorrelationScope; not a runtime or SDK facade"
        evidence:
          - platform-tracing-api/src/main/java/space/br1440/platform/tracing/api/TraceOperations.java
          - platform-tracing-api/CHANGELOG.md
        compatibility: additive methods allowed in minor; semantic or rename changes require ADR while pre-production
        owner: platform-tracing
        verification:
          - platform-tracing-otel/src/test/java/space/br1440/platform/tracing/otel/DefaultTraceOperationsTest.java
          - platform-tracing-spring-boot-autoconfigure/src/test/java/space/br1440/platform/tracing/autoconfigure/TracingAutoConfigurationTest.java
        disposition: none
        semanticConceptIds: [trace-operations-facade]

