description = 'E2E-тесты цепочки трассировки: OpenTelemetry SDK → Collector → Jaeger. ' +
        'Запускаются через Testcontainers и проверяют tail-sampling политики Collector\'а ' +
        '(errors-always, slow-always) и доступность span\'ов через Jaeger v3 Query API. ' +
        'Модуль НЕ публикуется в Nexus (test-only артефакт).'

sourceSets {
    customRule {
        java {
            srcDir 'src/customRule/java'
        }
        resources {
            srcDir 'src/customRule/resources'
        }
    }
    testExtension {
        java {
            srcDir 'src/testExtension/java'
        }
        resources {
            srcDir 'src/testExtension/resources'
        }
    }
    readinessFixtureExtension {
        java {
            srcDir 'src/readinessFixtureExtension/java'
        }
        resources {
            srcDir 'src/readinessFixtureExtension/resources'
        }
    }
    e2FailureExtension {
        java {
            srcDir 'src/e2FailureExtension/java'
        }
        resources {
            srcDir 'src/e2FailureExtension/resources'
        }
    }
    e1Consumer {
        java {
            srcDir 'src/e1Consumer/java'
        }
        resources {
            srcDir 'src/e1Consumer/resources'
        }
    }
    configProvenance {
        java {
            srcDir 'src/configProvenance/java'
        }
        resources {
            srcDir 'src/configProvenance/resources'
        }
    }
    privateMBeanServerExtension {
        java {
            srcDir 'src/privateMBeanServerExtension/java'
        }
        resources {
            srcDir 'src/privateMBeanServerExtension/resources'
        }
    }
    privateMBeanServerApp {
        java {
            srcDir 'src/privateMBeanServerApp/java'
        }
        resources {
            srcDir 'src/privateMBeanServerApp/resources'
        }
    }
    domainObservationE2e {
        java {
            srcDir 'src/domainObservationE2e/java'
        }
        compileClasspath += sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
}

configurations {
    otelJavaAgent
    otelExtensionClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

// Этот модуль не должен публиковаться: он содержит только e2e-тесты.
// В корневом build.gradle для всех subprojects применяется maven-publish; здесь подавляем
// эту публикацию, чтобы избежать публикации пустого jar'а в Nexus.
afterEvaluate {
    tasks.matching { it.name.startsWith("publish") }.configureEach { it.enabled = false }
}

dependencies {
    testImplementation platform(project(':platform-tracing-bom'))
    testImplementation platform('org.testcontainers:testcontainers-bom')

    // Платформенные модули — для запуска SDK с CompositeSampler и SpanProcessor'ами в test-режиме.
    testImplementation project(':platform-tracing-api')
    testImplementation project(':platform-tracing-otel')
    testImplementation project(':platform-tracing-otel-javaagent-extension')
    testImplementation project(':platform-tracing-collector-config')

    // Autoconfigure только для domain-observation cross-CL E2E: общий test classpath
    // не должен тянуть TracingRuntimeAutoConfiguration (ломает agent smoke Spring contexts).
    domainObservationE2eImplementation platform(project(':platform-tracing-bom'))
    domainObservationE2eImplementation project(':platform-tracing-spring-boot-autoconfigure')
    domainObservationE2eImplementation project(':platform-tracing-otel-javaagent-extension')
    domainObservationE2eImplementation project(':platform-tracing-otel')
    domainObservationE2eImplementation project(':platform-tracing-api')
    domainObservationE2eImplementation 'org.junit.jupiter:junit-jupiter'
    domainObservationE2eImplementation 'org.assertj:assertj-core'

    // OpenTelemetry SDK + OTLP exporter.
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

    // Testcontainers + JUnit 5 extension.
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'

    // JDBC + OTel Java Agent для DbSemconvAgentSmokeTest (Agent 2.28.x, см. gradle.properties).
    testImplementation 'org.postgresql:postgresql'
    otelJavaAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${openTelemetryInstrumentationBomVersion}"

    // Extension smoke: non-transitive classpath — Agent не подтягивает transitive deps автоматически.
    otelExtensionClasspath platform(project(':platform-tracing-bom'))
    otelExtensionClasspath(project(path: ':platform-tracing-otel-javaagent-extension', configuration: 'runtimeElements')) {
        transitive = false
    }
    otelExtensionClasspath(project(path: ':platform-tracing-api', configuration: 'runtimeElements')) {
        transitive = false
    }
    otelExtensionClasspath 'org.slf4j:slf4j-api'

    // Awaitility для декларативного ожидания tail-sampling decision_wait окна.
    testImplementation 'org.awaitility:awaitility'

    // OkHttp + Jackson для запросов к Jaeger Query API (v3).
    testImplementation 'com.squareup.okhttp3:okhttp'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'

    // Spring Boot Web для HTTP force-sampling smoke (spring-webmvc + servlet, как prod).
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // G2-05-e2e: WebFlux + platform tracing starter (Reactor publishOn + Agent path).
    testImplementation project(':platform-tracing-spring-boot-starter-reactive')
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'

    // G2-MDC-e2e (Wave 2): platform-tracing-servlet + platform-logging + OpenTelemetryAppender.
    testImplementation project(':platform-tracing-spring-boot-starter-servlet')

    // DupSpans HTTP smoke: без bridge Micrometer Observation не экспортирует span'ы в OTel/Jaeger
    // (production path использует Agent-only; здесь намеренно симулируем dev/staging path с suppress=false).
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'space.br1440.platform.starters:spring-boot-starter-platform-logging:1.0.4'
    testImplementation 'org.zalando:logbook-core'
    testImplementation 'org.zalando:logbook-servlet'
    testImplementation "io.opentelemetry.instrumentation:opentelemetry-logback-mdc-1.0:${openTelemetryInstrumentationAlphaVersion}"

    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.slf4j:slf4j-api'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    customRuleImplementation project(':platform-tracing-api')
    customRuleCompileOnly 'io.opentelemetry:opentelemetry-api'
    customRuleCompileOnly 'jakarta.annotation:jakarta.annotation-api'

    // Test-only classloader visibility probe extension JAR.
    // Загружается через otel.javaagent.extensions в дочерней JVM E2E-теста.
    testExtensionCompileOnly project(':platform-tracing-api')
    testExtensionCompileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'

    // Test-only extension, публикующий управляемые состояния readiness для packaged E1 matrix.
    readinessFixtureExtensionImplementation platform(project(':platform-tracing-bom'))
    readinessFixtureExtensionCompileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'

    // Изолированный E2 fixture: моделирует исключения на callback-стадиях Agent SDK autoconfigure.
    e2FailureExtensionImplementation platform(project(':platform-tracing-bom'))
    e2FailureExtensionCompileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'

    // Минимальный consumer graph: ровно servlet starter, без test SDK и Actuator.
    e1ConsumerImplementation platform(project(':platform-tracing-bom'))
    e1ConsumerImplementation project(':platform-tracing-spring-boot-starter-servlet')

    testImplementation sourceSets.e1Consumer.output

    // Step 0B / S-06 approved production stack: Boot baseline from gradle.properties (3.5.5)
    // plus Northfields 2025.0.0 — isolated from production BOM; does not change publication metadata.
    configProvenanceImplementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${rootProject.springBootVersion}")
    configProvenanceImplementation enforcedPlatform('org.springframework.cloud:spring-cloud-dependencies:2025.0.0')
    configProvenanceImplementation 'org.springframework.cloud:spring-cloud-starter-config'
    configProvenanceImplementation 'org.springframework.cloud:spring-cloud-config-server'
    configProvenanceImplementation 'org.springframework.boot:spring-boot-starter-web'
    configProvenanceImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    configProvenanceImplementation 'org.springframework.boot:spring-boot-starter-test'
    configProvenanceRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // S-03: полностью test-only Agent/App classloader fixture для private MBeanServer.
    privateMBeanServerExtensionCompileOnly platform(project(':platform-tracing-bom'))
    privateMBeanServerExtensionCompileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    privateMBeanServerAppImplementation platform(project(':platform-tracing-bom'))
    privateMBeanServerAppImplementation 'org.springframework:spring-context'
}

tasks.register('verifyExtensionDeps') {
    dependsOn configurations.otelExtensionClasspath
    doLast {
        def allowed = ['platform-tracing-otel-javaagent-extension', 'platform-tracing-api', 'slf4j-api'] as Set
        def artifacts = configurations.otelExtensionClasspath.resolvedConfiguration.resolvedArtifacts
        def unexpected = artifacts.findAll { !allowed.contains(it.moduleVersion.id.name) }
        if (!unexpected.isEmpty()) {
            throw new GradleException("Unexpected extension deps: ${unexpected*.name}")
        }
    }
}

tasks.register('customRuleJar', Jar) {
    archiveClassifier.set('custom-rule')
    from sourceSets.customRule.output
}

tasks.named('processCustomRuleResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Test-only extension JAR, содержащий ClassLoaderVisibilityTestProbe.
// Загружается через otel.javaagent.extensions; OTel Agent создаёт отдельный ExtensionClassLoader
// для каждого JAR в директории extensions, поэтому platform-tracing-api должен быть embedded,
// чтобы SpanAttributeScrubbingRule был доступен в этом CL — аналогично agentExtensionJar.
tasks.register('testClassLoaderProbeJar', Jar) {
    archiveClassifier.set('cl-probe')
    dependsOn project(':platform-tracing-api').tasks.named('jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.testExtension.output
    from { zipTree(project(':platform-tracing-api').jar.archiveFile) }
}

tasks.named('processTestExtensionResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('testReadinessFixtureExtensionJar', Jar) {
    archiveClassifier.set('readiness-fixture')
    from sourceSets.readinessFixtureExtension.output
}

tasks.named('processReadinessFixtureExtensionResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('testE2FailureExtensionJar', Jar) {
    archiveClassifier.set('e2-failure-extension')
    from sourceSets.e2FailureExtension.output
}

tasks.named('processE2FailureExtensionResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('testE2FailureAgentJar', Jar) {
    dependsOn ':platform-tracing-otel-javaagent-extension:platformExtendedAgentJar', testE2FailureExtensionJar
    archiveFileName.set('opentelemetry-javaagent-e2-failure-fixture.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from {
        zipTree(project(':platform-tracing-otel-javaagent-extension').tasks.named('platformExtendedAgentJar')
                .get().archiveFile.get().asFile)
    }
    from(testE2FailureExtensionJar.archiveFile) {
        into 'extensions'
    }
    doFirst {
        manifest.from(
                zipTree(project(':platform-tracing-otel-javaagent-extension').tasks.named('platformExtendedAgentJar')
                        .get().archiveFile.get().asFile)
                        .matching { include 'META-INF/MANIFEST.MF' }
                        .singleFile
        )
    }
}

test {
    useJUnitPlatform()
    dependsOn verifyExtensionDeps, ':platform-tracing-otel-javaagent-extension:agentExtensionJar', customRuleJar,
              ':platform-tracing-otel-javaagent-extension:platformExtendedAgentJar',
              testClassLoaderProbeJar, testReadinessFixtureExtensionJar,
              testE2FailureAgentJar
    // E2E-тесты тяжёлые: даём им полный таймаут и не запускаем параллельно.
    maxParallelForks = 1
    // По умолчанию e2e-тесты исключаются из обычного gradle test, чтобы не замедлять CI без Docker.
    // Запускаются через `./gradlew :platform-tracing-e2e-tests:test -PrunE2e`.
    onlyIf { project.hasProperty('runE2e') }
    // Private MBeanServer isolation requires private.mbeanserver.* system properties and
    // fixture JARs owned by privateMBeanServerTest / privateMBeanServerVerify.
    filter {
        excludeTestsMatching 'space.br1440.platform.tracing.e2e.jmx.PrivateMBeanServerIsolationE2ETest'
        excludeTestsMatching 'space.br1440.platform.tracing.e2e.jmx.DomainObservationCrossClassLoaderE2ETest'
    }
    doFirst {
        systemProperty 'otel.javaagent.jar', configurations.otelJavaAgent.singleFile.absolutePath
        systemProperty 'smoke.controlled.agent.jar',
                project(':platform-tracing-otel-javaagent-extension').tasks.named('platformExtendedAgentJar')
                        .get().archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.e2.failure.agent.jar',
                testE2FailureAgentJar.archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.test.runtime.classpath', sourceSets.test.runtimeClasspath.asPath
        systemProperty 'smoke.e1.consumer.runtime.classpath', sourceSets.e1Consumer.runtimeClasspath.asPath
        systemProperty 'smoke.otel.extension.jar',
                project(':platform-tracing-otel-javaagent-extension').tasks.named('agentExtensionJar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.custom.rule.jar', customRuleJar.archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.test.classloader.probe.extension.jar',
                testClassLoaderProbeJar.archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.readiness.fixture.extension.jar',
                testReadinessFixtureExtensionJar.archiveFile.get().asFile.absolutePath
    }
}

tasks.register('configProvenanceTest', Test) {
    group = 'verification'
    description = 'Runs isolated Spring Cloud Config provenance characterization (Step 0B).'
    testClassesDirs = sourceSets.configProvenance.output.classesDirs
    classpath = sourceSets.configProvenance.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'config.provenance.evidence.file',
            layout.buildDirectory.file('reports/config-provenance/evidence.txt').get().asFile.absolutePath
    doFirst {
        delete layout.buildDirectory.file('reports/config-provenance/evidence.txt')
    }
}

tasks.register('testPrivateMBeanServerExtensionJar', Jar) {
    archiveClassifier.set('private-mbeanserver-spike')
    from sourceSets.privateMBeanServerExtension.output
}

tasks.named('processPrivateMBeanServerExtensionResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('domainObservationE2eTest', Test) {
    group = 'verification'
    description = 'Cross-classloader round-trip for six domain JMX observations (agent CL encode → app CL decode).'
    dependsOn domainObservationE2eClasses,
            ':platform-tracing-otel-javaagent-extension:agentExtensionJar',
            ':platform-tracing-otel:jar',
            ':platform-tracing-api:jar'
    testClassesDirs = sourceSets.domainObservationE2e.output.classesDirs
    classpath = sourceSets.domainObservationE2e.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.e2e.jmx.DomainObservationCrossClassLoaderE2ETest'
    }
    doFirst {
        systemProperty 'smoke.otel.extension.jar',
                project(':platform-tracing-otel-javaagent-extension').tasks.named('agentExtensionJar')
                        .get().archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.platform.otel.jar',
                project(':platform-tracing-otel').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'smoke.platform.api.jar',
                project(':platform-tracing-api').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    }
}

tasks.register('privateMBeanServerTest', Test) {
    group = 'verification'
    description = 'Runs the S-03 private process-local MBeanServer process and classloader spike.'
    dependsOn testClasses, privateMBeanServerAppClasses, testPrivateMBeanServerExtensionJar,
            ':platform-tracing-otel-javaagent-extension:platformExtendedAgentJar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.e2e.jmx.PrivateMBeanServerIsolationE2ETest'
    }
    doFirst {
        systemProperty 'private.mbeanserver.agent.jar',
                project(':platform-tracing-otel-javaagent-extension').tasks
                        .named('platformExtendedAgentJar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'private.mbeanserver.extension.jar',
                testPrivateMBeanServerExtensionJar.archiveFile.get().asFile.absolutePath
        systemProperty 'private.mbeanserver.app.classpath',
                sourceSets.privateMBeanServerApp.runtimeClasspath.asPath
        systemProperty 'private.mbeanserver.agent.only.classpath',
                sourceSets.privateMBeanServerApp.output.classesDirs.asPath
        systemProperty 'private.mbeanserver.evidence.dir',
                rootProject.layout.projectDirectory.dir(
                        'docs/research/evidence/private-mbeanserver').asFile.absolutePath
    }
}
