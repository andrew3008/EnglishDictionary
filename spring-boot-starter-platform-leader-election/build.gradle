plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.aspectj:aspectjweaver'
    compileOnly 'io.lettuce:lettuce-core'
    compileOnly 'io.micrometer:micrometer-core'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly "org.jetbrains:annotations:${libs.versions.jetbrains.annotations.get()}"
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation libs.bundles.testcontainers
    testImplementation "org.awaitility:awaitility:${libs.versions.awaitility.get()}"
    testImplementation "redis.clients:jedis:${libs.versions.jedis.get()}"

    testImplementation 'io.micrometer:micrometer-core'

    testImplementation 'org.aspectj:aspectjweaver'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'integration'
    }
}
