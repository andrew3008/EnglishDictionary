    testClassesDirs = jmxSpringProject.sourceSets.test.output.classesDirs
    classpath = jmxSpringProject.sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.autoconfigure.diagnostics.jmx.ObjectNameConstantsConsistencyTest'
    }
}

tasks.register('jmxManagementContractVerify') {
    group = 'verification'
    dependsOn jmxManagementContractBaselineTest, jmxObjectNameConsistencyTest
}

