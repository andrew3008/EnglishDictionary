plugins {
    id 'base'
}

allprojects {
    group = 'space.br1440.platform.starters'
    version = '1.0.9'
}

tasks.register('publishAllToNexus') {
    group = 'publishing'
    dependsOn subprojects.collect { "${it.path}:publish" }
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    dependsOn subprojects.collect { "${it.path}:publishToMavenLocal" }
}
