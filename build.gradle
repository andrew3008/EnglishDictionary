tasks.register('sliceJStaleNameVerify') {
    group = 'verification'
    description = 'Rejects stale Slice J artifact, project and Agent package names in active files.'
    inputs.files(sliceJActiveRenameFiles)

    doLast {
        // Строки собраны частями, чтобы проверка не находила собственные сигнатуры.
        def staleNames = [
                'platform-tracing-' + 'core',
                'platform-tracing-otel-' + 'extension',
                'space.br1440.platform.tracing.otel.' + 'extension',
                'space/br1440/platform/tracing/otel/' + 'extension',
        ]
        def violations = []
        inputs.files.files.findAll { it.isFile() }.sort { it.path }.each { file ->
            String content = file.getText('UTF-8')
            staleNames.each { staleName ->
                if (content.contains(staleName)) {
                    violations.add("${rootDir.toPath().relativize(file.toPath())}: ${staleName}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Slice J stale-name verification failed:\n${violations.join('\n')}")
        }
        logger.lifecycle('Slice J stale-name verification passed')
    }
}

