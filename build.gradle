    group = 'verification'
    dependsOn jmxExtensionProject.tasks.named('testClasses')
    testClassesDirs = jmxExtensionProject.sourceSets.test.output.classesDirs
    classpath = jmxExtensionProject.sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.otel.javaagent.jmx.observation.JmxObservationWireContractIndependentVerifyTest'
    }
