def jmxWireGoldenFilesIdenticalCheck = tasks.register('jmxWireGoldenFilesIdenticalCheck') {
    group = 'verification'
    def autoconfigureGolden = layout.projectDirectory.file(
            'platform-starters-tracing/spring-boot-starter-platform-tracing-autoconfigure/src/test/resources/jmx-observation-wire-contract-golden.properties')
    def agentGolden = layout.projectDirectory.file(
            'platform-starters-tracing/platform-tracing-otel-javaagent-extension/src/test/resources/jmx-observation-wire-contract-golden.properties')
    inputs.file(autoconfigureGolden)
    inputs.file(agentGolden)
    doLast {
        if (!Arrays.equals(autoconfigureGolden.asFile.bytes, agentGolden.asFile.bytes)) {
            throw new GradleException('The Spring and Agent JMX golden resources are not byte-for-byte identical')
        }
    }
}

tasks.register('jmxWireGoldenParityVerify') {
    group = 'verification'
    dependsOn jmxWireGoldenFilesIdenticalCheck, jmxWireGoldenAutoconfigureTest, jmxWireGoldenAgentTest
}

def tracingConfigurationInventoryTest = tasks.register('tracingConfigurationInventoryTest', Test) {
    group = 'verification'
    dependsOn jmxSpringProject.tasks.named('testClasses')
    testClassesDirs = jmxSpringProject.sourceSets.test.output.classesDirs
    classpath = jmxSpringProject.sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.autoconfigure.inventory.*'
    }
    systemProperty 'wire.golden.repo.root', rootProject.projectDir.absolutePath
    if (providers.gradleProperty('updateTracingConfigurationInventory').isPresent()) {
        systemProperty 'tracing.configuration.inventory.update', 'true'
    }
}

tasks.register('tracingConfigurationInventoryVerify') {
    group = 'verification'
    dependsOn tracingConfigurationInventoryTest
}

