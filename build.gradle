tasks.register('pa1PublishedArtifactConsumerVerify') {
    group = 'verification'
    description = 'Verifies PA-1 bridge ABI using production published JAR with provenance.'

    doLast {
        File repository = layout.buildDirectory.dir('pa1-published-artifact-maven-repository').get().asFile
        File fixture = file('gradle/pa1-published-artifact-consumer')
        File wrapper = file(System.getProperty('os.name').toLowerCase().contains('windows')
                ? 'gradlew.bat' : 'gradlew')

        File otelVersionDir = new File(repository,
                "space/br1440/platform/tracing/platform-tracing-otel/${project.version}")
        File otelJar = otelVersionDir.listFiles()
                ?.findAll { it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-javadoc') }
                ?.max { it.lastModified() }
        if (otelJar == null || !otelJar.isFile()) {
            throw new GradleException("PA-1 published otel jar not found under ${otelVersionDir}")
        }

        String sha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(otelJar.bytes)
                .collect { String.format('%02x', it) }
                .join('')
        String commitSha = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (commitSha.isBlank()) {
            throw new GradleException('PA-1 provenance requires git commit SHA')
        }

        def runFixture = { String taskName ->
            List<String> command = []
            if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                command.addAll(['cmd.exe', '/d', '/c'])
            }
            command.add(wrapper.absolutePath)
            command.addAll([
                    '-p', fixture.absolutePath,
                    taskName,
                    "-Ppa1Repository=${repository.absolutePath}",
                    "-PpublishedOtelJar=${otelJar.absolutePath}",
                    "-PpublishedOtelSha256=${sha256}",
                    "-PpublishedGitCommit=${commitSha}",
                    "-PplatformTracingVersion=${project.version}",
                    '--no-daemon'
            ])

            Process process = new ProcessBuilder(command.collect { it.toString() })
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            String output = process.inputStream.getText('UTF-8')
            int exitCode = process.waitFor()
            return [exitCode: exitCode, output: output]
        }

        def positive = runFixture('verifyPublishedArtifactConsumer')
        if (positive.exitCode != 0) {
            throw new GradleException("PA-1 published artifact positive consumer failed:\n${positive.output}")
        }

        def negative = runFixture('compileGovernanceBypassProbe')
        if (negative.exitCode == 0) {
            throw new GradleException('PA-1 negative compile unexpectedly succeeded: governance bypass method exists')
        }
        if (!negative.output.contains('executionFromGovernedSpec')) {
            throw new GradleException("PA-1 negative compile failed for an unexpected reason:\n${negative.output}")
        }

        logger.lifecycle("PA-1 published artifact consumer verification passed (jar=${otelJar.name}, sha256=${sha256}, commit=${commitSha})")
    }
}

