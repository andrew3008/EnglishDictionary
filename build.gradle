plugins {
    id 'base'
}

allprojects {
    group = 'space.br1440.platform.starters'
    version = '2.0.0'
}

def nonPublishedProjects = [
        ':platform-starters-tracing',
        ':platform-starters-tracing:platform-tracing-testkit',
        ':platform-starters-tracing:platform-tracing-otel-javaagent-extension',
        ':platform-starters-tracing:platform-tracing-jmx-contract',
        ':platform-starters-tracing:platform-tracing-e2e-tests',
        ':platform-starters-error-handling',
        ':platform-starters-common',
] as Set

def publishedProjects = subprojects.findAll { project -> project.path !in nonPublishedProjects }

tasks.register('publishAllToNexus') {
    group = 'publishing'
    dependsOn publishedProjects.collect { "${it.path}:publishAllToNexus" }
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    dependsOn publishedProjects.collect { "${it.path}:publishAllToMavenLocal" }
}
