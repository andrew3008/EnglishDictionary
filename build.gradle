plugins {
    id 'base'
}

allprojects {
    group = 'space.br1440.platform.starters'
    version = '1.1.0'
}

configure(subprojects.findAll { project ->
    project.path in [
            ':platform-error-handling-core',
            ':spring-boot-starter-platform-error-handling-mvc',
            ':spring-boot-starter-platform-error-handling-webflux',
    ]
}) {
    group = 'space.br1440.platform.starters.errorhandling'
}

tasks.register('publishAllToNexus') {
    group = 'publishing'
    dependsOn subprojects.collect { "${it.path}:publishAllToNexus" }
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    dependsOn subprojects.collect { "${it.path}:publishAllToMavenLocal" }
}
