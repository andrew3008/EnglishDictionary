plugins {
    id 'base'
}

tasks.withType(Test).configureEach {
    binaryResultsDirectory = layout.buildDirectory.dir("test-results/${name}/binary")
    reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${name}")
    reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${name}")
}

allprojects {
    group = 'space.br1440.platform.starters'
    version = '1.2.0-SNAPSHOT'
}

configure(subprojects.findAll { project ->
    project.path in [
            ':platform-error-handling-core',
            ':spring-boot-starter-platform-error-handling-mvc',
            ':spring-boot-starter-platform-error-handling-webflux',
            ':spring-boot-starter-platform-error-handling-grpc',
    ]
}) {
    group = 'space.br1440.platform.starters.errorhandling'
}

def nonPublishedProjects = [
        ':platform-tracing-testkit',
] as Set

def publishedProjects = subprojects.findAll { project -> project.path !in nonPublishedProjects }

def verifyNonPublishedTracingModules = tasks.register('verifyNonPublishedTracingModules') {
    group = 'verification'
    doLast {
        nonPublishedProjects.each { projectPath ->
            def publicationTasks = project(projectPath).tasks.names.findAll { taskName ->
                taskName.startsWith('publish')
            }
            if (!publicationTasks.isEmpty()) {
                throw new GradleException(
                        "Git-only module ${projectPath} exposes publication tasks: ${publicationTasks.sort()}")
            }
        }
    }
}

tasks.register('publishAllToNexus') {
    group = 'publishing'
    dependsOn verifyNonPublishedTracingModules
    dependsOn publishedProjects.collect { "${it.path}:publishAllToNexus" }
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    dependsOn verifyNonPublishedTracingModules
    dependsOn publishedProjects.collect { "${it.path}:publishAllToMavenLocal" }
}

def tracingPublicationProjects = [
        ':spring-boot-starter-platform-bom',
        ':platform-tracing-api',
        ':platform-tracing-otel',
        ':platform-tracing-spring-boot-autoconfigure',
        ':platform-tracing-autoconfigure-webmvc',
        ':platform-tracing-autoconfigure-webflux',
        ':spring-boot-starter-platform-tracing-mvc',
        ':spring-boot-starter-platform-tracing-webflux',
        ':platform-tracing-otel-javaagent-extension',
]

tasks.register('publishTracingToVerificationRepository') {
    group = 'publishing'
    dependsOn verifyNonPublishedTracingModules
    dependsOn tracingPublicationProjects.collect { "${it}:publishToMavenLocal" }
    doFirst {
        String repository = System.getProperty('maven.repo.local')
        if (repository == null || repository.isBlank()) {
            throw new GradleException('Set -Dmaven.repo.local to an isolated directory before publishing tracing verification artifacts')
        }
    }
}

tasks.register('tracingPublishedConsumerVerify', GradleBuild) {
    group = 'verification'
    dir = layout.projectDirectory.dir('verification/tracing-published-consumer')
    tasks = ['verifyPublishedArtifacts']
    startParameter.projectProperties = [
            tracingVerificationRepository: providers.systemProperty('maven.repo.local').getOrElse(''),
            tracingVerificationVersion: project.version.toString(),
    ]
    doFirst {
        if (startParameter.projectProperties.tracingVerificationRepository.isBlank()) {
            throw new GradleException('Set -Dmaven.repo.local to the isolated tracing verification repository')
        }
    }
}

def otelProductionJavaSources = fileTree(rootDir) {
    include 'platform-starters-tracing/*/src/main/java/**/*.java'
    exclude '**/build/**'
}

def otelInternalApiAllowList = [
        'platform-starters-tracing/platform-tracing-otel-javaagent-extension/src/main/java/space/br1440/platform/tracing/otel/javaagent/processor/PlatformEndingSpanProcessor.java',
] as Set

def otelAgentExtensionApiAllowList = [
        'platform-starters-tracing/platform-tracing-otel-javaagent-extension/src/main/java/space/br1440/platform/tracing/otel/javaagent/bootstrap/ActivationAgentListener.java',
] as Set

def verifyOtelUnstableApiBoundariesTask = tasks.register('verifyOtelUnstableApiBoundaries') {
    group = 'verification'
    inputs.files(otelProductionJavaSources).withPathSensitivity(PathSensitivity.RELATIVE)

    doLast {
        def relativePath = { File file ->
            rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
        }
        def usersOf = { java.util.regex.Pattern pattern ->
            otelProductionJavaSources.files.findAll { file ->
                pattern.matcher(file.getText('UTF-8')).find()
            }.collect(relativePath).toSet()
        }
        def verifyExact = { String boundary, Set actual, Set expected ->
            Set unexpected = actual - expected
            Set missing = expected - actual
            if (!unexpected.isEmpty() || !missing.isEmpty()) {
                throw new GradleException(
                        "OpenTelemetry ${boundary} boundary changed. " +
                                "Unexpected users=${unexpected.sort()}, missing allow-listed users=${missing.sort()}")
            }
        }

        Set internalUsers = usersOf(~/(?m)^\s*import\s+io\.opentelemetry\.[\w.]*\.internal\.[\w.*]+;\s*$/)
        Set agentExtensionUsers = usersOf(~/(?m)^\s*import\s+io\.opentelemetry\.javaagent\.extension\.[\w.*]+;\s*$/)
        Set forbiddenAgentToolingUsers = usersOf(
                ~/(?m)^\s*import\s+io\.opentelemetry\.javaagent\.(?:tooling|bootstrap)\.[\w.*]+;\s*$/)

        verifyExact('internal API', internalUsers, otelInternalApiAllowList)
        verifyExact('Agent extension API', agentExtensionUsers, otelAgentExtensionApiAllowList)
        if (!forbiddenAgentToolingUsers.isEmpty()) {
            throw new GradleException(
                    'OpenTelemetry Agent tooling/bootstrap APIs are forbidden in production sources: ' +
                            forbiddenAgentToolingUsers.sort())
        }
    }
}

def jmxExtensionProject = project(':platform-tracing-otel-javaagent-extension')
def jmxSpringProject = project(':platform-tracing-spring-boot-autoconfigure')

def jmxManagementContractBaselineTest = tasks.register('jmxManagementContractBaselineTest', Test) {
    group = 'verification'
    dependsOn jmxExtensionProject.tasks.named('testClasses')
    testClassesDirs = jmxExtensionProject.sourceSets.test.output.classesDirs
    classpath = jmxExtensionProject.sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.otel.javaagent.jmx.DomainMBeanJmxComplianceTest'
    }
}

