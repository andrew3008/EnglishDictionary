import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

dependencies {
    implementation 'org.slf4j:slf4j-api'
    implementation 'net.logstash.logback:logstash-logback-encoder'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.aspectj:aspectjweaver'

    compileOnly 'org.zalando:logbook-core'
    compileOnly 'org.zalando:logbook-servlet'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    compileOnly 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.springframework.grpc:spring-grpc-server-web-spring-boot-starter'

    compileOnly 'org.springframework.boot:spring-boot-starter-webflux'

    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'ch.qos.logback:logback-classic'
    testImplementation libs.jsonschema.validator
}

apply from: rootProject.file('gradle/platformLogSchemaHash.gradle')

// Класс applied-скрипта недоступен как property; берём его из ext на конфигурации.
def schemaHashes = platformLogSchemaHashesType

def platformLogSchemaElements = configurations.register('platformLogSchemaElements') {
    it.canBeConsumed = true
    it.canBeResolved = false
    it.visible = false
}

def platformLogMaskingElements = configurations.register('platformLogMaskingElements') {
    it.canBeConsumed = true
    it.canBeResolved = false
    it.visible = false
}

def preparePlatformLogSchema = tasks.register('preparePlatformLogSchema', Sync) {
    from('src/main/resources/space/br1440/platform/logging') {
        include 'platform-log-event-v1.schema.json'
    }
    into layout.buildDirectory.dir('platform-log-schema')
    doLast {
        destinationDir.eachFile { File file ->
            file.bytes = schemaHashes.normalize(file.bytes)
        }
        Set<String> names = destinationDir.list() as Set
        if (names != (schemaHashes.FILE_NAMES as Set)) {
            throw new GradleException("preparePlatformLogSchema allowlist mismatch: ${names}")
        }
    }
}

abstract class PlatformLogSchemaDirArguments implements CommandLineArgumentProvider {
    @InputDirectory
    @PathSensitive(PathSensitivity.NONE)
    abstract DirectoryProperty getSchemaDir()

    @Override
    Iterable<String> asArguments() {
        ["-DplatformLog.schemaDir=${schemaDir.get().asFile.absolutePath}"]
    }
}

def verifyPlatformLogSchema = tasks.register('verifyPlatformLogSchema', Test) {
    // platform.testing отключает дополнительные Test-задачи; gate должен выполняться.
    enabled = true
    dependsOn preparePlatformLogSchema
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'space.br1440.platform.logging.schema.PlatformLogSchemaOwnerVerificationTest'
    }
    def arguments = objects.newInstance(PlatformLogSchemaDirArguments)
    arguments.schemaDir.fileProvider(preparePlatformLogSchema.map { it.destinationDir })
    jvmArgumentProviders.add(arguments)
}

def preparePlatformLogMasking = tasks.register('preparePlatformLogMasking', Sync) {
    from('src/main/resources/space/br1440/platform/logging') {
        include 'platform-log-masking-rules.yaml'
    }
    into layout.buildDirectory.dir('platform-log-masking')
}

artifacts {
    add(platformLogSchemaElements.name, preparePlatformLogSchema.map { it.destinationDir }) {
        builtBy(verifyPlatformLogSchema)
        type = 'directory'
    }
    add(platformLogMaskingElements.name, preparePlatformLogMasking.map { it.destinationDir }) {
        builtBy(preparePlatformLogMasking)
        type = 'directory'
    }
}

tasks.named('test', Test) {
    enabled = true
    exclude '**/PlatformLogSchemaOwnerVerificationTest.class'
}

tasks.named('check') {
    dependsOn verifyPlatformLogSchema
}

afterEvaluate {
    tasks.named('test', Test) {
        enabled = true
    }
    tasks.named('verifyPlatformLogSchema', Test) {
        enabled = true
    }
}
