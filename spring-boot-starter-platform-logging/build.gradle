plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'

}


group = rootProject.group
version = rootProject.version


repositories {
    maven {
        url "https://n.1440.space/repository/mcc-maven/"
    }
    maven {
        url "https://n.1440.space/repository/mcc-maven-snapshot"
    }
    maven {
        url "https://n.1440.space/repository/maven2-proxy/"
    }
    maven {
        url = uri("https://n.1440.space/repository/plugins.gradle.org-proxy/")
    }
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    implementation 'org.zalando:logbook-core:3.12.2'
    implementation 'org.zalando:logbook-servlet:3.12.2'
    implementation 'org.zalando:logbook-json:3.12.2'

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.2'

    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly "org.springframework.boot:spring-boot-configuration-processor"
    compileOnly 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.springframework.grpc:spring-grpc-server-web-spring-boot-starter:0.6.0'


    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation 'org.aspectj:aspectjweaver:1.9.24'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}