import org.gradle.api.attributes.Attribute

import space.br1440.platform.tracing.gradle.javaagent.JavaAgentDistribution
import space.br1440.platform.tracing.gradle.javaagent.ValidateJavaAgentExtensionComponentsTask

plugins {
    id 'com.gradleup.shadow'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

def extensionArtifactId = 'platform-tracing-otel-javaagent-extension'
def packagedElementsName = 'packagedJavaAgentExtensionElements'
def packagedLibraryElements = 'javaagent-extension-jar'
def runtimeClasspath = configurations.named('runtimeClasspath')
def versions = extensions.getByType(VersionCatalogsExtension).named('libs')

def componentIdentity = { component ->
    if (component instanceof ProjectComponentIdentifier) {
        return "project:${component.projectPath}"
    }

    if (component instanceof ModuleComponentIdentifier) {
        return "${component.group}:${component.module}:${component.version}"
    }

    throw new GradleException("Unsupported javaagent extension component identifier: ${component}")
}

def packagedComponents = [
        'project::platform-starters-tracing:spring-boot-starter-platform-tracing-api',
        'project::platform-starters-tracing:platform-tracing-runtime-policy',
        'project::platform-starters-common:platform-starters-common-util',
        "io.opentelemetry.proto:opentelemetry-proto:${versions.findVersion('bom.otelproto').get().getRequiredVersion()}",
        "com.google.protobuf:protobuf-java:${versions.findVersion('bom.protobuf').get().getRequiredVersion()}"
] as Set

def followedPackagedModules = [
        'jakarta.annotation:jakarta.annotation-api'
] as Set

def otelVersion = versions.findVersion('bom.opentelemetry').get().getRequiredVersion()
def providedComponents = [
        "io.opentelemetry:opentelemetry-api:${otelVersion}",
        "io.opentelemetry:opentelemetry-context:${otelVersion}",
        "io.opentelemetry:opentelemetry-common:${otelVersion}"
] as Set

def resolvedComponents = runtimeClasspath.flatMap { configuration ->
    configuration.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.collect { artifact -> componentIdentity(artifact.id.componentIdentifier) } as Set
    }
}

def validateComponents = tasks.register(
        'validateJavaAgentExtensionComponents',
        ValidateJavaAgentExtensionComponentsTask
) { task ->
    task.group = 'verification'
    task.description = 'Validates the complete runtime component set before javaagent extension packaging'
    task.getResolvedComponents().set(resolvedComponents)
    task.getPackagedComponents().set(packagedComponents)
    task.getFollowedPackagedModules().set(followedPackagedModules)
    task.getProvidedComponents().set(providedComponents)
}

def extensionSchemaFile = layout.buildDirectory.file(
        'resources/main/META-INF/platform-tracing/agent-logging-schema.properties'
)
def extensionSchema = extensionSchemaFile.map { file ->
    JavaAgentDistribution.ExtensionSchema.readFromProperties(file.asFile.toPath())
}

def relocationRules = [
        'com.google.protobuf': 'space.br1440.platform.tracing.otel.javaagent.shaded.com.google.protobuf',
        'io.opentelemetry.proto': 'space.br1440.platform.tracing.otel.javaagent.shaded.io.opentelemetry.proto'
]

def packageExtension = tasks.named('shadowJar', ShadowJar) {
    group = 'build'
    description = 'Packages the production javaagent extension and its approved runtime dependencies'
    dependsOn(validateComponents, tasks.named('processResources'))

    archiveFileName = "${extensionArtifactId}-${project.version}.jar"
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('packaged-javaagent-extension')
    configurations = [runtimeClasspath.get()]
    duplicatesStrategy = DuplicatesStrategy.FAIL
    failOnDuplicateEntries.set(true)
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    // Подписи исходных JAR недействительны после объединения содержимого.
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.EC'

    // Дескрипторы отдельных модулей не описывают объединённый JAR.
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    // В runtime остаётся только идентификатор схемы, а не исходный JSON.
    exclude 'platform-log-event.schema.json'

    dependencies {
        exclude(dependency('io.opentelemetry:opentelemetry-api:.*'))
        exclude(dependency('io.opentelemetry:opentelemetry-context:.*'))
        exclude(dependency('io.opentelemetry:opentelemetry-common:.*'))
    }

    inputs.property('relocationRules', relocationRules)
    relocationRules.each { source, destination -> relocate(source, destination) }

    manifest {
        attributes(
                'Implementation-Title': extensionArtifactId,
                'Implementation-Version': project.version,
                'Platform-Log-Schema-Version': extensionSchema.map { schema -> schema.semanticVersion() },
                'Platform-Log-Schema-SHA256': extensionSchema.map { schema -> schema.sha256() }
        )
    }
}

def packagedElements = configurations.create(packagedElementsName) {
    canBeConsumed = true
    canBeResolved = false
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE as Attribute<Object>, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE as Attribute<Object>, objects.named(Category, Category.LIBRARY))
        attribute(Bundling.BUNDLING_ATTRIBUTE as Attribute<Object>, objects.named(Bundling, Bundling.SHADOWED))
        attribute(
                LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE as Attribute<Object>,
                objects.named(LibraryElements, packagedLibraryElements)
        )
    }
}

artifacts.add(packagedElements.name, packageExtension.flatMap { task -> task.archiveFile }) {
    builtBy(packageExtension)
    type = 'jar'
}
