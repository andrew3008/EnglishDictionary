plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

configurations {
    controlledAgentUnderTest {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    controlledWebFluxHarness {
        java.srcDir 'src/controlledWebFluxHarness/java'
    }

    controlledWebFluxHarnessTest {
        java.srcDir 'src/controlledWebFluxHarnessTest/java'
        compileClasspath += sourceSets.test.compileClasspath + sourceSets.controlledWebFluxHarness.output
        runtimeClasspath += sourceSets.test.runtimeClasspath + sourceSets.controlledWebFluxHarness.output
    }
}

dependencies {
    api project(':platform-starters-tracing:spring-boot-starter-platform-tracing-autoconfigure')
    api project(':platform-starters-tracing:spring-boot-starter-platform-tracing-api')
    api 'io.micrometer:micrometer-observation'
    api 'io.micrometer:context-propagation'

    implementation project(':platform-starters-tracing:platform-tracing-runtime-policy')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.slf4j:slf4j-api'

    compileOnly 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.springframework:spring-webflux'
    compileOnly 'io.projectreactor:reactor-core'
    compileOnly 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-webflux')
    testImplementation project(':platform-starters-tracing:platform-tracing-testkit')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    controlledAgentUnderTest project(
            path: ':platform-starters-tracing:platform-tracing-otel-javaagent-distribution',
            configuration: 'controlledAgentElements'
    )
    controlledWebFluxHarnessImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-webflux')
    controlledWebFluxHarnessImplementation 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.register('controlledWebFluxHarnessTest', Test) {
    group = 'verification'
    description = 'Controlled WebFlux runtime for Reactor context propagation.'

    testClassesDirs = sourceSets.controlledWebFluxHarnessTest.output.classesDirs
    classpath = sourceSets.controlledWebFluxHarnessTest.runtimeClasspath

    def harnessRuntime = sourceSets.controlledWebFluxHarness.runtimeClasspath
    inputs.files(harnessRuntime).withPropertyName('harnessRuntime').withNormalizer(ClasspathNormalizer)

    platformSystemProperties.singleFile('platform.tracing.controlledAgent', configurations.controlledAgentUnderTest)
    platformSystemProperties.value('platform.tracing.webfluxHarness.classpath', providers.provider { harnessRuntime.asPath })
}
