static Map<String, String> readExtensionSchemaIdentity(File library) {
    Map<String, String> values = readZipProperties(library, 'META-INF/platform-tracing/agent-logging-schema.properties')
    if (values.get('schema.semanticVersion') == null || values.get('schema.sha256') == null) {
        throw new GradleException('Extension schema identity is incomplete in ' + library)
    }

    values
}

static Map<String, String> readZipProperties(File archive, String entryName) {
    Map<String, String> values = new LinkedHashMap<>()
    ZipFile zip = new ZipFile(archive, StandardCharsets.UTF_8)
    try {
        def entry = zip.getEntry(entryName)
        if (entry == null) {
            throw new GradleException(entryName + ' is missing from ' + archive)
        }

        String content = new String(zip.getInputStream(entry).bytes, StandardCharsets.UTF_8)
        for (String line : content.readLines()) {
            int delimiter = line.indexOf('=')
            if (delimiter > 0 && delimiter < line.length() - 1) {
                values.put(line.substring(0, delimiter), line.substring(delimiter + 1))
            }
        }
    } finally {
        zip.close()
    }

    values
}

static void validateExtensionAllowlist(Map<String, String> coordinates, Set<String> allowed) {
    coordinates.values().each { String coordinate ->
        if (!allowed.contains(coordinate)) {
            throw new GradleException('Extension runtime dependency is not allowlisted: ' + coordinate)
        }
    }
}

static void rejectReservedOtelEntries(File agent, Set<String> reservedEntries) {
    ZipFile zip = new ZipFile(agent, StandardCharsets.UTF_8)
    try {
        zip.entries().each { entry ->
            String name = entry.name
            String normalized = name.toLowerCase(Locale.ROOT)
            if (normalized.startsWith('extensions/') || normalized == 'extensions') {
                throw new GradleException('OTel Java agent already contains extension content: ' + name)
            }

            if (reservedEntries.any { String reserved -> reserved.equalsIgnoreCase(name) }) {
                throw new GradleException('OTel Java agent already contains reserved entry: ' + name)
            }
        }
    } finally {
        zip.close()
    }
}

static String sha256Hex(File file) {
    byte[] digest = MessageDigest.getInstance('SHA-256').digest(file.bytes)
    StringBuilder result = new StringBuilder(digest.length * 2)
    digest.each { byte value ->
        result.append(String.format('%02x', value & 0xFF))
    }
    result.toString()
}

static void writeIdentityFile(File identity,
                              String version,
                              String upstreamCoordinate,
                              String upstreamSha256,
                              String extensionSha256,
                              String extensionPath) {
    TreeMap<String, String> values = new TreeMap<>()
    values.put('format.version', '1')
    values.put('distribution.group', 'space.br1440.platform.starters.tracing')
    values.put('distribution.artifact', 'platform-tracing-javaagent')
    values.put('distribution.version', version)
    values.put('upstream.coordinate', upstreamCoordinate)
    values.put('upstream.sha256', upstreamSha256)
    values.put('extension.path', extensionPath)
    values.put('extension.sha256', extensionSha256)
    values.put('minimum.java', '21')

    StringBuilder content = new StringBuilder()
    values.each { String key, String value ->
        content.append(key).append('=').append(value).append('\n')
    }
    identity.parentFile.mkdirs()
    identity.setText(content.toString(), 'UTF-8')
}

static void publishAtomically(Path source, Path target) {
    Path parent = target.getParent()
    if (parent == null) {
        throw new GradleException('Published agent output must have a parent directory: ' + target)
    }

    Files.createDirectories(parent)
    Path temporary = Files.createTempFile(parent, '.' + target.getFileName() + '.', '.tmp')
    try {
        Files.copy(source, temporary, StandardCopyOption.REPLACE_EXISTING)
        try {
            Files.move(
                    temporary,
                    target,
                    StandardCopyOption.ATOMIC_MOVE,
                    StandardCopyOption.REPLACE_EXISTING
            )
        } catch (AtomicMoveNotSupportedException exception) {
            throw new GradleException(
                    'Atomic move is not supported for controlled agent output: ' + target,
                    exception
            )
        }
    } finally {
        Files.deleteIfExists(temporary)
    }
}
