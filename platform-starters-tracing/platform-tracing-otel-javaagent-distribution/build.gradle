import java.nio.charset.StandardCharsets
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
    id 'com.gradleup.shadow'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

def otelJavaAgentVersion = libs.versions.bom.otelinstrumentation.get()
def otelSdkVersion = libs.versions.bom.opentelemetry.get()
def resolvedOtelJavaAgentCoordinate = 'io.opentelemetry.javaagent:opentelemetry-javaagent:' + otelJavaAgentVersion
def extensionProjectPath = ':platform-starters-tracing:platform-tracing-otel-javaagent-extension'
def tracingApiProjectPath = ':platform-starters-tracing:spring-boot-starter-platform-tracing-api'
def runtimePolicyProjectPath = ':platform-starters-tracing:platform-tracing-runtime-policy'
def commonUtilProjectPath = ':platform-starters-common:platform-starters-common-util'
def junitJupiterVersion = libs.versions.junit.jupiter.get()
def assertjCoordinate = 'org.assertj:assertj-core:' + libs.versions.assertj.get()
def jakartaAnnotationApiCoordinate = 'jakarta.annotation:jakarta.annotation-api:2.1.1'
def otelProtoCoordinate = 'io.opentelemetry.proto:opentelemetry-proto:' + libs.versions.bom.otelproto.get()
def protobufJavaCoordinate = 'com.google.protobuf:protobuf-java:' + libs.versions.bom.protobuf.get()
def shadedPrefix = 'space.br1440.platform.tracing.otel.javaagent.shaded.'
def otelApiModule = 'io.opentelemetry:opentelemetry-api'
def otelContextModule = 'io.opentelemetry:opentelemetry-context'
def otelCommonModule = 'io.opentelemetry:opentelemetry-common'
def embeddedExtensionJarName = 'platform-tracing-otel-javaagent-extension.jar'
def extensionEntryPath = 'extensions/' + embeddedExtensionJarName
def identityEntryPath = 'META-INF/platform-tracing/javaagent-distribution.properties'
def standaloneExtensionJarName = 'platform-tracing-otel-javaagent-extension-' + project.version + '.jar'

def otelJavaAgent = configurations.create('otelJavaAgent') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def agentExtension = configurations.create('agentExtension') {
    canBeConsumed = false
    canBeResolved = true
    transitive = true

    AttributeContainer attrs = attributes

    Usage javaRuntimeUsage = objects.<Usage>named(Usage, Usage.JAVA_RUNTIME)
    attrs.attribute(Usage.USAGE_ATTRIBUTE as Attribute<Object>, javaRuntimeUsage)

    Category libraryCategory = objects.<Category>named(Category, Category.LIBRARY)
    attrs.attribute(Category.CATEGORY_ATTRIBUTE as Attribute<Object>, libraryCategory)

    LibraryElements jarLibraryElements = objects.<LibraryElements>named(LibraryElements, LibraryElements.JAR)
    attrs.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE as Attribute<Object>, jarLibraryElements)

    Bundling externalBundling = objects.<Bundling>named(Bundling, Bundling.EXTERNAL)
    attrs.attribute(Bundling.BUNDLING_ATTRIBUTE as Attribute<Object>, externalBundling)
}

dependencies {
    add(otelJavaAgent.name, resolvedOtelJavaAgentCoordinate)
    add(agentExtension.name, project(path: extensionProjectPath))
}

Provider<File> otelJavaAgentFile = otelJavaAgent.incoming.files.elements.map {
    Set<? extends FileSystemLocation> locations ->
        List<File> files = locations.collect { FileSystemLocation location -> location.asFile }
        if (files.size() != 1) {
            throw new GradleException('otelJavaAgent must resolve to exactly one artifact, got '
                    + files.size() + ': ' + files)
        }
        files.first()
} as Provider<File>

Provider<File> agentExtensionFile = agentExtension.incoming.artifacts.resolvedArtifacts.map {
    Set<ResolvedArtifactResult> artifacts ->
        List<ResolvedArtifactResult> extensionArtifacts = artifacts.findAll {
            ResolvedArtifactResult artifact ->
                def component = artifact.id.componentIdentifier
                component instanceof ProjectComponentIdentifier
                        && component.projectPath == extensionProjectPath
        }.toList()

        if (extensionArtifacts.size() != 1) {
            throw new GradleException("""Platform OTEL Agent Extension must resolve exactly one project JAR for ${extensionProjectPath}, got ${extensionArtifacts}""")
        }

        extensionArtifacts.first().file
} as Provider<File>

Provider<Map<String, String>> agentExtensionArtifactCoordinates =
        agentExtension.incoming.artifacts.resolvedArtifacts.map {
            Set<ResolvedArtifactResult> artifacts ->
                Map<String, String> coordinates = new TreeMap<>()

                artifacts.each { ResolvedArtifactResult artifact ->
                    def component = artifact.id.componentIdentifier

                    String coordinate
                    if (component instanceof ProjectComponentIdentifier) {
                        coordinate = 'project:' + component.projectPath
                    } else if (component instanceof ModuleComponentIdentifier) {
                        coordinate = component.group + ':' + component.module + ':' + component.version
                    } else {
                        throw new GradleException('Unsupported agentExtension component identifier: ' + component)
                    }

                    coordinates.put(artifact.file.name, coordinate)
                }
                coordinates
        } as Provider<Map<String, String>>

Provider<Map<String, String>> extensionSchemaIdentity = agentExtensionFile.map { File library ->
    readExtensionSchemaIdentity(library)
}

Provider<RegularFile> controlledAgentJarFile = layout.buildDirectory.file('libs/platform-tracing-javaagent-' + project.version + '.jar') as Provider<RegularFile>
Provider<RegularFile> stagingAgentJarFile = layout.buildDirectory.file('controlled-agent/staging/platform-tracing-javaagent-' + project.version + '.jar') as Provider<RegularFile>
Provider<RegularFile> identityFile = layout.buildDirectory.file('controlled-agent/staging/javaagent-distribution.properties') as Provider<RegularFile>
def stagingTreeDir = layout.buildDirectory.dir('controlled-agent/staging-tree')
def allowedExtensionCoordinates = [
        'project:' + extensionProjectPath,
        'project:' + tracingApiProjectPath,
        'project:' + runtimePolicyProjectPath,
        'project:' + commonUtilProjectPath,
        jakartaAnnotationApiCoordinate,
        otelProtoCoordinate,
        protobufJavaCoordinate,
        otelApiModule + ':' + otelSdkVersion,
        otelContextModule + ':' + otelSdkVersion,
        otelCommonModule + ':' + otelSdkVersion
] as Set

def packageStandaloneExtension = tasks.named('shadowJar') {
    group = 'build'
    archiveFileName = standaloneExtensionJarName
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))

    configurations = [agentExtension]
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.EC'
    exclude 'META-INF/LICENSE.txt'
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
    exclude 'platform-log-event.schema.json'

    dependencies {
        include(project(extensionProjectPath))
        include(project(tracingApiProjectPath))
        include(project(runtimePolicyProjectPath))
        include(project(commonUtilProjectPath))
        include(dependency(jakartaAnnotationApiCoordinate))
        include(dependency(otelProtoCoordinate))
        include(dependency(protobufJavaCoordinate))

        exclude(dependency(otelApiModule))
        exclude(dependency(otelContextModule))
        exclude(dependency(otelCommonModule))
    }

    relocate 'com.google.protobuf', shadedPrefix + 'com.google.protobuf'
    relocate 'io.opentelemetry.proto', shadedPrefix + 'io.opentelemetry.proto'

    manifest {
        attributes(
                'Implementation-Title': 'platform-tracing-otel-javaagent-extension',
                'Implementation-Version': project.version.toString(),
                'Platform-Log-Schema-Version': extensionSchemaIdentity.map { it.get('schema.semanticVersion') },
                'Platform-Log-Schema-SHA256': extensionSchemaIdentity.map { it.get('schema.sha256') }
        )
    }
}

Provider<RegularFile> standaloneExtensionJarFile = packageStandaloneExtension.flatMap {
    AbstractArchiveTask task -> task.archiveFile
} as Provider<RegularFile>

def validateControlledAgentInputs = tasks.register('validateControlledAgentInputs') {
    group = 'build'
    description = 'Pin/SHA check of the OTel agent, allowlist of extension dependencies, identity write'

    inputs.file(otelJavaAgentFile)
    inputs.file(agentExtensionFile)
    inputs.file(standaloneExtensionJarFile)
    inputs.property('distributionVersion', project.version.toString())
    inputs.property('otelJavaAgentCoordinate', resolvedOtelJavaAgentCoordinate)
    inputs.property('extensionCoordinates', agentExtensionArtifactCoordinates)

    outputs.file(identityFile)

    def allowedCoordinates = allowedExtensionCoordinates
    def reservedEntries = [extensionEntryPath, identityEntryPath] as Set
    def publishedExtensionPath = extensionEntryPath
    def resolvedDistributionVersion = project.version.toString()

    doLast {
        validateExtensionAllowlist(agentExtensionArtifactCoordinates.get(), allowedCoordinates)

        File agent = otelJavaAgentFile.get()
        File library = agentExtensionFile.get()
        File packaged = standaloneExtensionJarFile.get().asFile

        Map<String, String> pin = readZipProperties(
                library,
                'META-INF/platform-tracing/otel-javaagent-acp-pin.properties'
        )

        String reviewed = pin.get('otel.javaagent.sha256')
        String actual = sha256Hex(agent)
        if (reviewed == null || reviewed != actual) {
            throw new GradleException(
                    'Resolved OTel Java agent SHA-256 ' + actual
                            + ' does not match reviewed ' + reviewed)
        }

        rejectReservedOtelEntries(agent, reservedEntries)
        writeIdentityFile(
                identityFile.get().asFile,
                resolvedDistributionVersion,
                resolvedOtelJavaAgentCoordinate,
                actual,
                sha256Hex(packaged),
                publishedExtensionPath
        )
    }
}

def syncControlledAgentStaging = tasks.register('syncControlledAgentStaging', Sync) {
    group = 'build'
    dependsOn validateControlledAgentInputs
    def extensionJarName = embeddedExtensionJarName

    from(otelJavaAgentFile.map {
        File agent -> zipTree(agent)
    })


    from(standaloneExtensionJarFile) {
        into 'extensions'
        rename { extensionJarName }
    }

    from(identityFile) {
        into 'META-INF/platform-tracing'
    }

    into(stagingTreeDir)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def assembleControlledJavaAgentJar = tasks.register('assembleControlledJavaAgentJar', Jar) {
    group = 'build'
    dependsOn syncControlledAgentStaging

    archiveFileName = 'platform-tracing-javaagent-' + project.version + '.jar'
    destinationDirectory.set(layout.buildDirectory.dir('controlled-agent/staging') as Provider<? extends Directory>)

    from(stagingTreeDir) {
        exclude 'META-INF/MANIFEST.MF'
    }

    manifest.from(stagingTreeDir.map { Directory directory ->
        directory.file('META-INF/MANIFEST.MF').asFile
    })

    preserveFileTimestamps = false
    reproducibleFileOrder = true
    metadataCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def publishControlledJavaAgent = tasks.register('publishControlledJavaAgent') {
    group = 'build'
    dependsOn assembleControlledJavaAgentJar

    inputs.file(stagingAgentJarFile)
    outputs.file(controlledAgentJarFile)

    doLast {
        publishAtomically(stagingAgentJarFile.get().asFile.toPath(),
                controlledAgentJarFile.get().asFile.toPath())
    }
}

def assembleControlledJavaAgent = tasks.register('assembleControlledJavaAgent') {
    group = 'build'
    description = 'Assemble the published controlled Java agent'
    dependsOn publishControlledJavaAgent
}

tasks.named('assemble') {
    dependsOn assembleControlledJavaAgent
}

def controlledAgentElements = configurations.create('controlledAgentElements') {
    canBeConsumed = true
    canBeResolved = false
}

artifacts {
    add(controlledAgentElements.name, controlledAgentJarFile) {
        builtBy assembleControlledJavaAgent
        type = 'jar'
    }
}

testing {
    suites {
        register('controlledAgentArtifactTest', JvmTestSuite) { JvmTestSuite suite ->
            suite.useJUnitJupiter(junitJupiterVersion)
            suite.dependencies.implementation.add(assertjCoordinate)
        }

        register('controlledAgentRuntimeTest', JvmTestSuite) { JvmTestSuite suite ->
            suite.useJUnitJupiter(junitJupiterVersion)
            suite.dependencies.implementation.add(assertjCoordinate)

            suite.dependencies.implementation.add(otelProtoCoordinate)
            suite.dependencies.implementation.add(protobufJavaCoordinate)

            suite.dependencies.compileOnly.add(otelApiModule + ':' + otelSdkVersion)
        }
    }
}

def otlpProbeApiRuntimeClasspath = configurations.create('otlpProbeApiRuntimeClasspath') {
    canBeConsumed = false
    canBeResolved = true
}

dependencies {
    add(otlpProbeApiRuntimeClasspath.name, otelApiModule + ':' + otelSdkVersion)
}

tasks.named('controlledAgentRuntimeTest', Test) {
    inputs.files(otlpProbeApiRuntimeClasspath)
            .withPropertyName('otlpProbeApiRuntimeClasspath')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    doFirst {
        systemProperty(
                'platformTracing.otlpProbeApiClasspath',
                otlpProbeApiRuntimeClasspath.files*.absolutePath.join(File.pathSeparator)
        )
    }
}

def jmxContractProject = project(':platform-starters-tracing:platform-tracing-jmx-contract')
def generateJmxWireContract = ':platform-starters-tracing:platform-tracing-jmx-contract:generateJmxWireContract'
def generatedApplicationContractCopy = layout.buildDirectory.dir('generated/jmx-wire-contract/application/java')

