abstract class ControlledAgentTestArguments implements CommandLineArgumentProvider {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getControlledAgentJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getExtensionJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getExtensionLibraryJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getOtelJavaAgentJar()

    @Input
    abstract Property<String> getDistributionVersion()

    @Input
    abstract Property<String> getOtelJavaAgentCoordinate()

    @Internal
    abstract DirectoryProperty getTestRepositoryRoot()

    @Override
    Iterable<String> asArguments() {
        [
                '-DplatformTracing.controlledAgentJar=' + controlledAgentJar.get().asFile.absolutePath,
                '-DplatformTracing.extensionJar=' + extensionJar.get().asFile.absolutePath,
                '-DplatformTracing.extensionLibraryJar=' + extensionLibraryJar.get().asFile.absolutePath,
                '-DplatformTracing.otelJavaAgentJar=' + otelJavaAgentJar.get().asFile.absolutePath,
                '-DplatformTracing.distributionVersion=' + distributionVersion.get(),
                '-DplatformTracing.otelJavaAgentCoordinate=' + otelJavaAgentCoordinate.get(),
                '-DplatformTracing.testRepository=' + testRepositoryRoot.get().asFile.absolutePath
        ]
    }
}

def testRepositoryName = 'testRepository'
def testRepositoryDir = layout.buildDirectory.dir('test-repository')

tasks.withType(Test).configureEach {
    enabled = true
    dependsOn assembleControlledJavaAgent

    def arguments = objects.newInstance(ControlledAgentTestArguments)
    arguments.controlledAgentJar.set(controlledAgentJarFile)
    arguments.extensionJar.set(standaloneExtensionJarFile)
    arguments.extensionLibraryJar.fileProvider(agentExtensionFile)
    arguments.otelJavaAgentJar.fileProvider(otelJavaAgentFile)
    arguments.distributionVersion.set(project.version.toString())
    arguments.otelJavaAgentCoordinate.set(resolvedOtelJavaAgentCoordinate)
    arguments.testRepositoryRoot.set(testRepositoryDir)

    jvmArgumentProviders.add(arguments)
}

tasks.named('check') {
    dependsOn testing.suites.named('controlledAgentArtifactTest')
    dependsOn testing.suites.named('controlledAgentRuntimeTest')
}

def targetsTestRepository = { Task task ->
    task instanceof PublishToMavenRepository && task.repository != null && task.repository.name == testRepositoryName
}

def resetTestRepository = tasks.register('resetTestRepository', Delete) {
    delete testRepositoryDir
}

def testRepositoryPublications = tasks.withType(AbstractPublishToMaven).matching(targetsTestRepository)

tasks.withType(AbstractPublishToMaven).configureEach { task ->
    task.dependsOn({ targetsTestRepository(task) ? resetTestRepository : tasks.named('check') })
}

def publishToTestRepository = tasks.register('publishToTestRepository') {
    group = 'verification'
    description = 'Publish every distribution publication into an isolated file repository'
    dependsOn testRepositoryPublications
}

def repositoryInventory = fileTree(testRepositoryDir) {
    exclude '**/maven-metadata*'
}

tasks.named('controlledAgentArtifactTest', Test) {
    dependsOn publishToTestRepository

    inputs.files(repositoryInventory)
            .withPropertyName('publishedRepositoryArtifacts')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

publishing {
    repositories {
        maven {
            name = testRepositoryName
            url = testRepositoryDir
        }
    }

    publications {
        named('mavenJava', MavenPublication) { MavenPublication publication ->
            publication.artifactId = 'platform-tracing-javaagent'
            publication.setArtifacts([])
            publication.artifact(controlledAgentJarFile) { MavenArtifact artifact ->
                artifact.builtBy(assembleControlledJavaAgent)
                artifact.extension = 'jar'
            }

            publication.pom { pom ->
                pom.name = 'Platform Tracing Controlled OpenTelemetry Java Agent'
                pom.description = 'Controlled OpenTelemetry Java agent distribution with the platform tracing extension embedded'
            }
        }

        create('extension', MavenPublication) { MavenPublication publication ->
            publication.artifactId = 'platform-tracing-otel-javaagent-extension'
            publication.artifact(packageStandaloneExtension)
            publication.pom { pom ->
                pom.name = 'Platform Tracing OTel Java agent extension'
                pom.description = 'Standalone platform OpenTelemetry Java agent extension artifact'
            }
        }
    }
}

