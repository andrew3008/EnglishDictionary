plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

configurations.create('jmxApplicationContractSources') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false

    attributes {
        attribute(Usage.USAGE_ATTRIBUTE as Attribute<Object>, objects.named(Usage, 'platform-jmx-application-contract'))
        attribute(Category.CATEGORY_ATTRIBUTE as Attribute<Object>, objects.named(Category, Category.DOCUMENTATION))
        attribute(DocsType.DOCS_TYPE_ATTRIBUTE as Attribute<Object>, objects.named(DocsType, DocsType.SOURCES))
    }
}

sourceSets.main.java.srcDir(configurations.jmxApplicationContractSources)

def moduleVersionProvider = project.provider { project.version.toString() }
def moduleVersionOutputDir = layout.buildDirectory.dir('generated/module-version')

def writeStarterModuleVersion = tasks.register('writeStarterModuleVersion', WriteProperties) {
    group = 'build'
    description = 'Writes the module.version resource that StarterModuleVersionLoader reads at runtime'

    destinationFile = moduleVersionOutputDir.map {
        it.file('META-INF/platform-tracing/module-version/' + project.name + '.properties')
    }
    property('module.version', moduleVersionProvider)
}

def generatedModuleVersionResource = files(moduleVersionOutputDir).builtBy(writeStarterModuleVersion)

tasks.named('processResources', ProcessResources) {
    from(generatedModuleVersionResource)
}

tasks.named('test', Test) {
    def expectedVersion = moduleVersionProvider.get()

    inputs.property('expectedModuleVersion', expectedVersion)
    systemProperty('platformTracing.expectedModuleVersion', expectedVersion)
}

dependencies {
    jmxApplicationContractSources project(':platform-starters-tracing:platform-tracing-jmx-contract')

    api project(':platform-starters-tracing:spring-boot-starter-platform-tracing-api')
    implementation project(':platform-starters-tracing:platform-tracing-runtime-policy')
    api 'io.opentelemetry:opentelemetry-api'
    api 'io.micrometer:micrometer-observation'

    implementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-otel')
    implementation project(':platform-starters-common:platform-starters-common-util')
    implementation 'space.br1440.platform:error-handling-model'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.slf4j:slf4j-api'

    compileOnly 'io.micrometer:context-propagation'
    compileOnly 'io.micrometer:micrometer-tracing-bridge-otel'
    compileOnly 'org.springframework:spring-aop'
    compileOnly 'org.aspectj:aspectjweaver'
    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.springframework.cloud:spring-cloud-context'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-autoconfigure-webflux')
    testImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-autoconfigure-webmvc')
    testImplementation project(':platform-starters-tracing:platform-tracing-testkit')
    testImplementation project(':platform-starters-tracing:platform-tracing-otel-javaagent-extension')
    testImplementation 'com.tngtech.archunit:archunit-junit5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'io.micrometer:context-propagation'
    testImplementation 'org.springframework.cloud:spring-cloud-context'
    testImplementation 'org.springframework.cloud:spring-cloud-config-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'spring-boot-starter-platform-tracing-autoconfigure',
                'Implementation-Version': project.version
        )
    }
}
