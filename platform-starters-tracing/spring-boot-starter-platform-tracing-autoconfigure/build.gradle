plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

dependencies {
    api project(':platform-starters-tracing:spring-boot-starter-platform-tracing-api')
    api 'io.opentelemetry:opentelemetry-api'
    api 'io.micrometer:micrometer-observation'

    implementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-otel')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.slf4j:slf4j-api'

    compileOnly 'io.micrometer:micrometer-tracing-bridge-otel'
    compileOnly 'org.springframework:spring-aop'
    compileOnly 'org.aspectj:aspectjweaver'
    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.springframework.cloud:spring-cloud-context'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-autoconfigure-webflux')
    testImplementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-autoconfigure-webmvc')
    testImplementation project(':platform-starters-tracing:platform-tracing-testkit')
    testImplementation project(':platform-starters-tracing:platform-tracing-otel-javaagent-extension')
    testImplementation libs.archunit.junit5
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'io.micrometer:context-propagation'
    testImplementation 'org.springframework.cloud:spring-cloud-context'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'spring-boot-starter-platform-tracing-autoconfigure',
                'Implementation-Version': project.version
        )
    }
}
