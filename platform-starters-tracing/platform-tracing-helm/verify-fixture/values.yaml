platformTracing:
  serviceName: ballistics
  configurationAuthority: HELM
  resourceAttributes:
    serviceVersion: "2.0.0"
    deploymentEnvironmentName: staging

deployment:
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=80.0"
    - name: SPRING_PROFILES_ACTIVE
      value: staging
    - name: POSTGRES_URL
      valueFrom:
        secretKeyRef:
          name: ballistics-db
          key: url
