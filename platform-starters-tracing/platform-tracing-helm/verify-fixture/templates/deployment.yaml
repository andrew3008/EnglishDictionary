{{- $container := dict
      "name" "app"
      "image" "example/unused:digest"
      "env" .Values.deployment.env
      "command" .Values.deployment.command
      "args" .Values.deployment.args
      "envFrom" .Values.deployment.envFrom
-}}
{{- include "platform-tracing.v1.assertLaunchEnv" (dict "env" $container.env) -}}
{{- include "platform-tracing.v1.assertContainer" (dict "container" $container) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ $container.name }}
          image: {{ $container.image }}
          {{- if $container.command }}
          command:
            {{- toYaml $container.command | nindent 12 }}
          {{- end }}
          {{- if $container.args }}
          args:
            {{- toYaml $container.args | nindent 12 }}
          {{- end }}
          {{- if $container.envFrom }}
          envFrom:
            {{- toYaml $container.envFrom | nindent 12 }}
          {{- end }}
          env:
            {{- range $container.env }}
            - {{ . | toYaml | nindent 14 | trim }}
            {{- end }}
            {{- include "platform-tracing.v1.env" (dict "tracing" .Values.platformTracing) | nindent 12 }}
