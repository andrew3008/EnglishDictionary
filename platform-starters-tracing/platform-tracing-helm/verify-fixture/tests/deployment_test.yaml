suite: platform-tracing.v1.env / assertLaunchEnv / assertContainer via the verify fixture
templates:
  - templates/deployment.yaml
release:
  name: fixture
tests:
  - it: renders the managed OTEL_* environment with the shared Infra Collector defaults
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: ballistics
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_PROPAGATORS
            value: tracecontext,baggage,b3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
            value: grpc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.ops-system.svc.cluster.local:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: service.version=2.0.0,deployment.environment.name=staging
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: none
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_LOGS_EXPORTER
            value: none
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_TRACING_CONFIGURATION_AUTHORITY
            value: HELM
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_ENVIRONMENT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_TRACING_VALIDATION_MODE

  - it: emits optional PLATFORM_TRACING_VALIDATION_MODE when requested
    set:
      platformTracing.validationMode: STRICT
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_TRACING_VALIDATION_MODE
            value: STRICT

  - it: fails when the application env sets PLATFORM_TRACING_CONFIGURATION_AUTHORITY itself
    set:
      deployment.env:
        - name: PLATFORM_TRACING_CONFIGURATION_AUTHORITY
          value: ACTUATOR
    asserts:
      - failedTemplate:
          errorPattern: "reserved for platform-tracing.v1.env"

  - it: preserves the application's own JDK_JAVA_OPTIONS and valueFrom env untouched
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JDK_JAVA_OPTIONS
            value: "-XX:MaxRAMPercentage=80.0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_URL
            valueFrom:
              secretKeyRef:
                name: ballistics-db
                key: url

  - it: never emits JAVA_TOOL_OPTIONS itself (the launch contract is owned by the image, not this chart)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS

  - it: fails when the application env sets an OTEL_ variable itself
    set:
      deployment.env:
        - name: OTEL_SERVICE_NAME
          value: hand-rolled
    asserts:
      - failedTemplate:
          errorPattern: "reserved for platform-tracing.v1.env"

  - it: fails when the application env duplicates a variable name
    set:
      deployment.env:
        - name: SPRING_PROFILES_ACTIVE
          value: a
        - name: SPRING_PROFILES_ACTIVE
          value: b
    asserts:
      - failedTemplate:
          errorPattern: "duplicate variable"

  - it: fails when JAVA_TOOL_OPTIONS carries a competing -Dotel.* flag
    set:
      deployment.env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Dotel.propagators=tracecontext"
    asserts:
      - failedTemplate:
          errorPattern: "must not set -Dotel.propagators"

  - it: fails when JDK_JAVA_OPTIONS carries a second -javaagent
    set:
      deployment.env:
        - name: JDK_JAVA_OPTIONS
          value: "-javaagent:/opt/other/agent.jar"
    asserts:
      - failedTemplate:
          errorPattern: "must not contain -javaagent"

  - it: fails when _JAVA_OPTIONS is non-empty
    set:
      deployment.env:
        - name: _JAVA_OPTIONS
          value: "-Xmx256m"
    asserts:
      - failedTemplate:
          errorPattern: "_JAVA_OPTIONS must be empty"

  - it: fails when JAVA_TOOL_OPTIONS uses an opaque valueFrom
    set:
      deployment.env:
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: legacy-jvm-options
              key: opts
    asserts:
      - failedTemplate:
          errorPattern: "valueFrom is opaque at render time"

  - it: fails when JDK_JAVA_OPTIONS uses an opaque valueFrom
    set:
      deployment.env:
        - name: JDK_JAVA_OPTIONS
          valueFrom:
            secretKeyRef:
              name: legacy-jvm-options
              key: opts
    asserts:
      - failedTemplate:
          errorPattern: "valueFrom is opaque at render time"

  - it: fails when _JAVA_OPTIONS uses an opaque valueFrom
    set:
      deployment.env:
        - name: _JAVA_OPTIONS
          valueFrom:
            secretKeyRef:
              name: legacy-jvm-options
              key: opts
    asserts:
      - failedTemplate:
          errorPattern: "valueFrom is opaque at render time"

  - it: does NOT reject a literal @argument-file reference in JDK_JAVA_OPTIONS (accepted gap, see ADR 07)
    set:
      deployment.env:
        - name: JDK_JAVA_OPTIONS
          value: "@/config/jvm.opts"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JDK_JAVA_OPTIONS
            value: "@/config/jvm.opts"

  - it: fails when the container declares envFrom
    set:
      deployment.envFrom:
        - configMapRef:
            name: legacy-env
    asserts:
      - failedTemplate:
          errorPattern: "envFrom is not allowed"

  - it: fails when the container declares command
    set:
      deployment.command:
        - /bin/sh
        - -c
        - exec java -jar app.jar
    asserts:
      - failedTemplate:
          errorPattern: "command must stay unset"

  - it: fails when the container declares args
    set:
      deployment.args:
        - "--spring.profiles.active=staging"
    asserts:
      - failedTemplate:
          errorPattern: "args must stay unset"
