plugins {
    id 'platform.java-library'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

def jmxContractProjectPath = ':platform-starters-tracing:platform-tracing-jmx-contract'
def generateJmxWireContract = "${jmxContractProjectPath}:generateJmxWireContract"
def generatedJmxContractRoot = project(jmxContractProjectPath).layout.buildDirectory
        .dir('generated/jmx-wire-contract/extension')

def generatedJmxContractSources = files(generatedJmxContractRoot.map { it.dir('java') })
        .builtBy(generateJmxWireContract)
def generatedJmxContractResources = files(generatedJmxContractRoot.map { it.dir('resources') })
        .builtBy(generateJmxWireContract)

def extensionArtifactTitle = 'platform-tracing-otel-javaagent-extension'
def extensionArtifactMetadataOutputDir = layout.buildDirectory.dir('generated/extension-artifact-metadata')
def extensionArtifactMetadataPath = 'space/br1440/platform/tracing/otel/javaagent/readiness/platform-extension-build.properties'
def extensionVersionProvider = project.provider { project.version.toString() }

def writeExtensionArtifactMetadata = tasks.register('writeExtensionArtifactMetadata', WriteProperties) {
    group = 'build'
    description = 'Writes classloader-local identity and version metadata for the javaagent extension'

    destinationFile = extensionArtifactMetadataOutputDir.map { it.file(extensionArtifactMetadataPath) }
    property('format.version', '1')
    property('artifact', extensionArtifactTitle)
    property('version', extensionVersionProvider)
}

def generatedExtensionArtifactMetadata = files(extensionArtifactMetadataOutputDir)
        .builtBy(writeExtensionArtifactMetadata)

sourceSets.named('main') {
    java.srcDir(generatedJmxContractSources)
}

tasks.named('processResources', ProcessResources) {
    from(generatedJmxContractResources)
    from(generatedExtensionArtifactMetadata)
}

abstract class JavaAgentArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    abstract ConfigurableFileCollection getAgentClasspath()

    @Override
    Iterable<String> asArguments() {
        return ["-javaagent:${agentClasspath.singleFile.absolutePath}"]
    }
}

def mockitoAgentConfiguration = configurations.register('mockitoAgent') {
    canBeConsumed = false
    canBeResolved = true
}

dependencies {
    mockitoAgent platform(project(':spring-boot-starter-platform-bom'))
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }

    implementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-api')
    implementation project(':platform-starters-tracing:platform-tracing-runtime-policy')
    implementation project(':platform-starters-common:platform-starters-common-util')
    implementation 'io.opentelemetry.proto:opentelemetry-proto'
    implementation 'com.google.protobuf:protobuf-java'

    compileOnly 'io.opentelemetry:opentelemetry-sdk'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    compileOnly 'io.opentelemetry:opentelemetry-exporter-sender-okhttp'
    compileOnly 'io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(':platform-starters-tracing:platform-tracing-testkit')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation "org.openjdk.jol:jol-core:${libs.versions.jol.get()}"
    testImplementation "com.networknt:json-schema-validator:${libs.versions.json.schema.validator.get()}"

    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    testImplementation 'io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api'
    testImplementation 'io.opentelemetry:opentelemetry-extension-trace-propagators'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-logging'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-logging-otlp'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    testCompileOnly "com.google.auto.service:auto-service-annotations:${libs.versions.auto.service.get()}"
    testAnnotationProcessor "com.google.auto.service:auto-service:${libs.versions.auto.service.get()}"

    testRuntimeOnly project(path: ':spring-boot-starter-platform-logging', configuration: 'platformLogMaskingElements')
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    def expectedExtensionVersion = extensionVersionProvider.get()
    def mockitoAgentArguments = objects.newInstance(JavaAgentArgumentProvider)
    mockitoAgentArguments.agentClasspath.from(mockitoAgentConfiguration)
    jvmArgumentProviders.add(mockitoAgentArguments)

    inputs.property('expectedExtensionVersion', expectedExtensionVersion)
    systemProperty('platformTracing.expectedExtensionVersion', expectedExtensionVersion)
}

['testCompileClasspath', 'testRuntimeClasspath'].each { classpathName ->
    configurations.named(classpathName) {
        exclude group: 'net.bytebuddy', module: 'byte-buddy-dep'
    }
}
