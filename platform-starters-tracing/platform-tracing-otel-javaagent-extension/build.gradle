import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'platform.java-library-publish'
    id 'platform.java-library'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

platformJavaLibrary {
    bomProjectPath = ':spring-boot-starter-platform-bom'
}

apply from: rootProject.file('gradle/platformLogSchemaHash.gradle')

// Класс applied-скрипта недоступен как property; берём его из ext на конфигурации.
def schemaHashes = platformLogSchemaHashesType

def agentExtensionRuntime = configurations.create('agentExtensionRuntime') {
    canBeConsumed = false
    canBeResolved = true
    visible = false
    extendsFrom configurations.implementation, configurations.runtimeOnly
}

def agentExtensionJarElements = configurations.create('agentExtensionJarElements') {
    canBeConsumed = true
    canBeResolved = false
    visible = false
}

def platformLogMasking = configurations.register('platformLogMasking') {
    it.canBeConsumed = false
    it.canBeResolved = true
    it.visible = false
}

dependencies {
    implementation project(':platform-starters-tracing:spring-boot-starter-platform-tracing-api')
    implementation project(':platform-starters-tracing:platform-tracing-runtime-policy')
    implementation project(':platform-starters-common:platform-starters-common-util')

    add(platformLogMasking.name, project(
            path: ':spring-boot-starter-platform-logging',
            configuration: 'platformLogMaskingElements')) {
        transitive = false
    }

    compileOnly 'io.opentelemetry:opentelemetry-sdk'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    compileOnly 'io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(':platform-starters-tracing:platform-tracing-testkit')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    testImplementation('io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api') {
        exclude group: 'net.bytebuddy', module: 'byte-buddy-dep'
    }
    testImplementation 'io.opentelemetry:opentelemetry-extension-trace-propagators'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-logging'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-logging-otlp'
    testImplementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    testImplementation 'org.slf4j:slf4j-api'
    testImplementation 'ch.qos.logback:logback-classic'
    testImplementation libs.jsonschema.validator

    testCompileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

abstract class GenerateAgentLoggingSchemaIdentity extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getSchemaFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Internal
    Class schemaHashType

    @TaskAction
    void generate() {
        File schemaDir = schemaFiles.singleFile
        if (!schemaDir.directory) {
            throw new GradleException("Platform log schema artifact must be a directory: ${schemaDir}")
        }
        def hash = schemaHashType.hashSet(schemaDir)
        File meta = new File(outputDirectory.get().asFile, 'META-INF/platform-tracing')
        meta.mkdirs()
        new File(meta, 'agent-logging-schema.properties').setText(
                "schema.hashAlgorithm=${hash.algorithm}\n" +
                        "schema.name=${hash.name}\n" +
                        "schema.semanticVersion=${hash.semanticVersion}\n" +
                        "schema.sha256=${hash.setSha256}\n",
                'UTF-8'
        )
        new File(outputDirectory.get().asFile, 'agent-logging-schema-manifest.mf').setText(
                "Platform-Log-Schema-Version: ${hash.semanticVersion}\n" +
                        "Platform-Log-Schema-SHA256: ${hash.setSha256}\n",
                'UTF-8'
        )
    }
}

def preparePlatformLogSchema = tasks.register('preparePlatformLogSchema', Sync) {
    from('src/main/resources') {
        include 'platform-log-event.schema.json'
    }
    into layout.buildDirectory.dir('platform-log-schema')
    doLast {
        destinationDir.eachFile { File file ->
            file.bytes = schemaHashes.normalize(file.bytes)
        }
        Set<String> names = destinationDir.list() as Set
        if (names != (schemaHashes.FILE_NAMES as Set)) {
            throw new GradleException("preparePlatformLogSchema allowlist mismatch: ${names}")
        }
    }
}

def generateAgentLoggingSchemaIdentity = tasks.register(
        'generateAgentLoggingSchemaIdentity',
        GenerateAgentLoggingSchemaIdentity
) {
    schemaFiles.from(preparePlatformLogSchema.map { it.destinationDir })
    outputDirectory.convention(layout.buildDirectory.dir('generated/agent-logging-schema-identity'))
    schemaHashType = schemaHashes
}

def identityOutput = generateAgentLoggingSchemaIdentity.flatMap { it.outputDirectory }

tasks.named('processTestResources', ProcessResources) {
    from(platformLogMasking) {
        include 'platform-log-masking-rules.yaml'
    }
    from(identityOutput) {
        include 'META-INF/platform-tracing/agent-logging-schema.properties'
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('jar', Jar) {
    exclude 'platform-log-event.schema.json'
    manifest {
        attributes 'Implementation-Title': project.name, 'Implementation-Version': project.version
    }
}

def agentExtensionJarTask = tasks.register('agentExtensionJar', Jar) {
    archiveClassifier.set('extension')
    inputs.files(agentExtensionRuntime)
    exclude 'platform-log-event.schema.json'
    from sourceSets.main.output
    from {
        agentExtensionRuntime.incoming.files.findAll { it.name.endsWith('.jar') }.collect { file ->
            zipTree(file).matching {
                exclude 'META-INF/LICENSE.txt',
                        'META-INF/MANIFEST.MF',
                        'META-INF/*.SF',
                        'META-INF/*.RSA',
                        'META-INF/*.DSA',
                        'META-INF/versions/*/module-info.class',
                        'module-info.class'
            }
        }
    }
    from(identityOutput) {
        include 'META-INF/platform-tracing/agent-logging-schema.properties'
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes 'Implementation-Title': "${project.name}-extension",
                'Implementation-Version': project.version
        from(generateAgentLoggingSchemaIdentity.flatMap {
            it.outputDirectory.file('agent-logging-schema-manifest.mf')
        })
    }
}

artifacts {
    add(agentExtensionJarElements.name, agentExtensionJarTask)
}

abstract class ExtensionArtifactArguments implements CommandLineArgumentProvider {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLibraryJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getExtensionJar()

    @Override
    Iterable<String> asArguments() {
        [
                "-DplatformTracing.libraryJar=${libraryJar.get().asFile.absolutePath}",
                "-DplatformTracing.extensionJar=${extensionJar.get().asFile.absolutePath}"
        ]
    }
}

tasks.named('test', Test) {
    enabled = true
    exclude '**/AgentExtensionArtifactSurfaceTest.class'
}

def agentArtifactTestTask = tasks.register('agentArtifactTest', Test) {
    enabled = true
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'space.br1440.platform.tracing.otel.javaagent.arch.AgentExtensionArtifactSurfaceTest'
    }
    def arguments = objects.newInstance(ExtensionArtifactArguments)
    arguments.libraryJar.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    arguments.extensionJar.set(agentExtensionJarTask.flatMap { it.archiveFile })
    jvmArgumentProviders.add(arguments)
}

tasks.named('check') {
    dependsOn agentArtifactTestTask
}

afterEvaluate {
    tasks.named('test', Test) {
        enabled = true
    }
    tasks.named('agentArtifactTest', Test) {
        enabled = true
    }
}
