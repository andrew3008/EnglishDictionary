plugins {
    id 'platform.gradle-plugin-publish'
    id 'platform.testing'
}

group = 'space.br1440.platform.starters.tracing'

def distributionProjectPath = ':platform-starters-tracing:platform-tracing-otel-javaagent-distribution'

def jibPluginVersionFile = layout.buildDirectory.file('generated/jib-plugin-version.txt')
def writeJibPluginVersion = tasks.register('writeJibPluginVersion') {
    def version = project.version.toString()
    outputs.file(jibPluginVersionFile)
    doLast {
        def file = jibPluginVersionFile.get().asFile
        file.parentFile.mkdirs()
        file.setText(version + '\n', 'UTF-8')
    }
}

gradlePlugin {
    plugins {
        platformTracingJib {
            id = 'platform.tracing-jib'
            implementationClass = 'space.br1440.platform.tracing.gradle.PlatformTracingJibPlugin'
            displayName = 'Platform Tracing controlled Java agent'
            description = """
                    Adds the controlled Platform Tracing Java agent to a service build \
                    without any configuration in the consuming build script."""
        }
    }
}

def asResolvableAgentInput = { Configuration configuration ->
    configuration.canBeConsumed = false
    configuration.canBeResolved = true
    configuration.transitive = false
}
def controlledAgentDistribution = configurations.register('controlledAgentDistribution', asResolvableAgentInput)
def controlledAgentPin = configurations.register('controlledAgentPin', asResolvableAgentInput)

dependencies {
    add(controlledAgentDistribution.name, project(path: distributionProjectPath, configuration: 'controlledAgentElements'))
    add(controlledAgentPin.name, project(path: distributionProjectPath, configuration: 'controlledAgentPinElements'))

    compileOnly "com.google.cloud.tools:jib-gradle-plugin-extension-api:${libs.versions.jib.extension.api.get()}"
    compileOnly "com.google.cloud.tools:jib-gradle-plugin:${libs.versions.jib.gradle.plugin.get()}"

    compileOnly "org.projectlombok:lombok:${libs.versions.lombok.get()}"
    annotationProcessor "org.projectlombok:lombok:${libs.versions.lombok.get()}"

    testImplementation gradleApi()
    testImplementation gradleTestKit()
    testImplementation "com.google.cloud.tools:jib-gradle-plugin-extension-api:${libs.versions.jib.extension.api.get()}"
    testImplementation "com.google.cloud.tools:jib-gradle-plugin:${libs.versions.jib.gradle.plugin.get()}"
    testImplementation "org.junit.jupiter:junit-jupiter:${libs.versions.junit.jupiter.get()}"
    testImplementation "org.assertj:assertj-core:${libs.versions.assertj.get()}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources) {
    from(controlledAgentPin) {
        into 'META-INF/platform-tracing'
    }

    from(jibPluginVersionFile) {
        into 'META-INF/platform-tracing'
        rename { 'jib-plugin-version.txt' }
    }

    dependsOn writeJibPluginVersion
}

publishing {
    repositories {
        maven {
            name = 'functionalTest'
            url = layout.buildDirectory.dir('functional-test-repository')
        }
    }
}

tasks.named('test', Test) { Test test ->
    test.dependsOn 'publishAllPublicationsToFunctionalTestRepository'

    def systemProperties = test.platformSystemProperties
    systemProperties.singleFile('platformTracing.controlledAgentJar', controlledAgentDistribution)
    systemProperties.file('platformTracing.pluginJar', tasks.named('jar', Jar).flatMap { it.archiveFile })

    systemProperties.singleFile(
            'platformTracing.pluginPom',
            tasks.withType(GenerateMavenPom).matching { it.name == 'generatePomFileForPluginMavenPublication' }
    )

    systemProperties.singleFile(
            'platformTracing.markerPom',
            tasks.withType(GenerateMavenPom).matching { it.name == 'generatePomFileForPlatformTracingJibPluginMarkerMavenPublication' }
    )

    systemProperties.singleFile(
            'platformTracing.pluginModule',
            tasks.withType(GenerateModuleMetadata).matching { it.name == 'generateMetadataFileForPluginMavenPublication' }
    )

    systemProperties.value('platformTracing.pluginVersion', provider { project.version.toString() })
    systemProperties.untrackedDirectory('platformTracing.publishedRepository', layout.buildDirectory.dir('functional-test-repository'))
    systemProperties.untrackedDirectory('platformTracing.testKitDirectory', layout.buildDirectory.dir('test-kit'))
}

def verifyPluginPublications = tasks.register('verifyPluginPublications') {
    group = 'verification'
    description = 'Fails when the plugin module publishes anything besides pluginMaven and its marker'

    def actual = provider { publishing.publications.names.toList().sort() }
    def expected = ['platformTracingJibPluginMarkerMaven', 'pluginMaven']
    inputs.property('publications', actual)

    doLast {
        if (actual.get().toList() != expected) {
            throw new GradleException("Unexpected plugin publications: ${actual.get()}, expected ${expected}")
        }
    }
}

tasks.named('check') {
    dependsOn verifyPluginPublications
}
